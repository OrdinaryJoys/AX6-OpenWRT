# ath11k 模块参数 — AX6 (IPQ8074) 极致配置
#
# frame_mode=2 (ethernet decapsulation) — NSS WiFi offload 要求的帧格式
# NSS_REDIRECT 已由当前上游移除，不是此模式的配置前提。
# 当前 backports 映射: 0=raw, 1=native WiFi, 2=ethernet。
options ath11k frame_mode=2

# nss_offload 是 NSS 补丁新增参数，未显式设置时默认 0。
options ath11k nss_offload=1

# crypto_mode=0 使用 ath11k 硬件加密路径(1 才是软件加密)
options ath11k crypto_mode=0

# softdep 确保 qca-nss-drv 先于 ath11k 加载,NSS 固件就绪后再注册 WiFi offload
softdep ath11k pre: qca-nss-drv
