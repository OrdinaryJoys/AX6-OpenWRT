# yamllint disable rule:line-length
name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install tools
        run: |
          set -eo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y shellcheck yamllint
          # actionlint
          bash <(curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.0
          sudo mv actionlint /usr/local/bin/

      - name: Shellcheck (errors only block)
        run: |
          set -eo pipefail
          find . -type f \( -name "*.sh" -o -path "*/uci-defaults/*" -o -path "*/hotplug.d/*" -o -path "*/sbin/*" -o -path "*/usr/sbin/*" -o -path "*/usr/bin/*" \) ! -path "./.git/*" -print0 | \
            xargs -0 -P4 shellcheck -S error -f gcc
          sh tests/test-vlan-add.sh
          sh tests/test-openclash-archive.sh
          sh tests/test-zerotier-fw4.sh

      - name: Actionlint
        run: actionlint -color .github/workflows/*.yml

      - name: Yamllint (relaxed)
        run: yamllint -d relaxed .github/

      - name: Release tag provenance check
        run: |
          set -eo pipefail
          while IFS= read -r workflow; do
            if ! grep -Eq 'commit: .*github.sha' "$workflow"; then
              echo "::error file=$workflow::release-action must tag the workflow commit"
              exit 1
            fi
          done < <(grep -Rl 'uses: ncipollo/release-action@' .github/workflows)
          workflow=.github/workflows/build-AX6-NSS.yml
          grep -Fq 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$workflow"
          test "$(grep -F 'if: github.ref ==' "$workflow" | grep -Fc 'refs/heads/main')" -eq 2
          for workflow in \
            .github/workflows/build-AX6-IPQ.yml \
            .github/workflows/build-IMM.yml \
            .github/workflows/build-LEDE.yml; do
            if grep -Fq 'uses: ncipollo/release-action@' "$workflow"; then
              echo "::error file=$workflow::unlocked backup workflows must not publish Releases"
              exit 1
            fi
            grep -Fq 'UNVALIDATED_' "$workflow" || {
              echo "::error file=$workflow::backup artifact must include UNVALIDATED_ marker"
              exit 1
            }
          done

      - name: STOCK image safety policy
        run: |
          set -eo pipefail
          workflow=.github/workflows/build-AX6-NSS.yml
          grep -Fq "stock_partition_size=\$((0x06640000))" "$workflow"
          grep -Fq "stock_ubi_limit=\$((0x06340000))" "$workflow"
          grep -Fq 'xiaomi_stock_check_image_size' "$workflow"
          grep -Fq 'upload/upgrade/*' "$workflow"
          grep -Fq 'path: upload/recovery/*' "$workflow"

          if grep -Eq 'nand (erase|write).*rootfs|fastboot flash rootfs' \
            "$workflow" AX6-IPQ/HARDWARE.md; then
            echo "::error::Generic raw rootfs flashing commands are forbidden"
            exit 1
          fi

          grep -Fq 'SMEM/custom U-Boot merged rootfs' AX6-IPQ/files/sbin/nss-check
          grep -Fq '06640000' AX6-IPQ/HARDWARE.md

      - name: STOCK and EXPAND config difference allowlist
        run: |
          python3 - <<'PY'
          import re
          import sys


          def parse(path):
              values = {}
              with open(path) as stream:
                  for raw in stream:
                      line = raw.strip()
                      match = re.match(r'^(CONFIG_[A-Za-z0-9_-]+)=(.*)$', line)
                      if match:
                          values[match.group(1)] = match.group(2)
                          continue
                      match = re.match(
                          r'^# (CONFIG_[A-Za-z0-9_-]+) is not set$', line
                      )
                      if match:
                          values[match.group(1)] = 'n'
              return values


          allowed = {
              'CONFIG_TARGET_PROFILE',
              'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6',
              'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock',
          }
          stock = parse('AX6-IPQ/.config-stock')
          expand = parse('AX6-IPQ/.config-expand')
          unexpected = [
              symbol
              for symbol in sorted(set(stock) | set(expand))
              if stock.get(symbol) != expand.get(symbol) and symbol not in allowed
          ]
          if unexpected:
              print(
                  '::error::Unexpected STOCK/EXPAND config differences: '
                  + ' '.join(unexpected)
              )
              sys.exit(1)
          PY

      - name: AX6 NSS build lock check
        run: |
          set -eo pipefail
          set -a
          . .github/ax6-nss-lock.env
          set +a
          for name in \
            SOURCE_REPO SOURCE_TRACKING_BRANCH SOURCE_COMMIT \
            SQM_SCRIPTS_NSS_URL SQM_SCRIPTS_NSS_COMMIT \
            LUCI_FEED_URL LUCI_FEED_COMMIT \
            PACKAGES_FEED_URL PACKAGES_FEED_COMMIT \
            ROUTING_FEED_URL ROUTING_FEED_COMMIT \
            TELEPHONY_FEED_URL TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_URL VIDEO_FEED_COMMIT \
            ARGON_THEME_URL ARGON_THEME_COMMIT \
            ARGON_CONFIG_URL ARGON_CONFIG_COMMIT \
            OPENCLASH_URL OPENCLASH_REF; do
            value="${!name:-}"
            [ -n "$value" ] || {
              echo "::error::$name is missing from .github/ax6-nss-lock.env"
              exit 1
            }
          done
          for name in \
            SOURCE_COMMIT SQM_SCRIPTS_NSS_COMMIT LUCI_FEED_COMMIT \
            PACKAGES_FEED_COMMIT ROUTING_FEED_COMMIT TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_COMMIT ARGON_THEME_COMMIT ARGON_CONFIG_COMMIT; do
            value="${!name}"
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::$name must be a full 40-character lowercase commit SHA"
              exit 1
            }
          done
          [ "$SOURCE_TRACKING_BRANCH" = main ] || {
            echo "::error::unexpected source tracking branch: $SOURCE_TRACKING_BRANCH"
            exit 1
          }
          workflow=.github/workflows/build-AX6-NSS.yml
          grep -Fq 'CONFIG_ATH11K_NSS_MESH_SUPPORT) += ATH11K_NSS_MESH_SUPPORT' "$workflow"
          grep -Fq 'CONFIG_ATH11K_NSS_SUPPORT) += ATH11K_NSS_SUPPORT' "$workflow"
          grep -Fq 'ATH11K_NSS_SUPPORT must not force ATH11K_NSS_MESH_SUPPORT' "$workflow"
          # shellcheck disable=SC2016 # Match the literal tracking-source expression in diy.sh.
          grep -Fq 'clone_tracking "$OPENCLASH_URL" "${OPENCLASH_REF:-master}"' AX6-IPQ/diy.sh
          if grep -Eq 'OPENCLASH_(COMMIT|VERSION)' .github/ax6-nss-lock.env AX6-IPQ/diy.sh; then
            echo "::error::OpenClash plugin must track upstream ref, not a pinned plugin version"
            exit 1
          fi

      - name: Obsolete NSS config symbol check
        run: |
          set -eo pipefail
          obsolete=(
            ATH11K_NSS_TX_SUPPORT
            ATH11K_TX_QUEUE_SIZE
            ATH11K_NSS_4ADDR_SUPPORT
            ATH11K_MEM_PROFILE_1G
            ATH11K_MEM_PROFILE_256M
            ATH11K_NAPI_WEIGHT_1G
            ARM_PSCI_CPUIDLE
            ARM_PSCI_CPUIDLE_DOMAIN
            CPU_FREQ_MIN
            IPQ_MEM_PROFILE_1024
            IPQ_MEM_PROFILE_512
            IPQ_MEM_PROFILE_256
            KERNEL_IPQ_MEM_PROFILE
            KERNEL_BRIDGE_NETFILTER
            KERNEL_BRIDGE_NF_EBTABLES
            KERNEL_NET_RX_BUSY_POLL
            MAC80211_RC_DEFAULT_MINSTREL_HT
            MAC80211_RC_DEFAULT_MINSTREL_VHT
            MAC80211_RC_MINSTREL_VHT_AUTOFALLBACK
            NSS_DRV_C2C_ENABLE
            NSS_DRV_CAPWAP_ENABLE
            NSS_DRV_CLMAP_ENABLE
            NSS_DRV_IPV4_FORWARD_ENABLE
            NSS_DRV_IPV6_FORWARD_ENABLE
            NSS_DRV_IPV6_REDIRECT
            NSS_DRV_CONNTRACK_ENABLE
            NSS_DRV_DEBUG
            NSS_DRV_DTLS_ENABLE
            NSS_DRV_IPSEC_ENABLE
            NSS_DRV_OAM_ENABLE
            NSS_DRV_PVXLAN_ENABLE
            NSS_DRV_QVPN_ENABLE
            NSS_DRV_SFE_ENABLE
            NSS_DRV_TLS_ENABLE
            NSS_DRV_TSTAMP_ENABLE
            NSS_DRV_WDS_ENABLE
            NSS_DRV_WIFI_LEGACY_ENABLE
            NSS_DRV_NATP_ENABLE
            NSS_DRV_PORTID_ENABLE
            NSS_MEM_PROFILE_HIGH
            NSS_MEM_PROFILE_MEDIUM
            NSS_MEM_PROFILE_LOW
            NSS_MEM_PROFILE_HIGH_PERF
            NSS_PPE_QSZ_4096
            PACKAGE_MAC80211_NSS_SUPPORT
            REGULATOR_FIXED_VOLTAGE
            SERIAL_8250_RUNTIME_UARTS
            ZRAM_DEF_COMP_LZORLE
            ZRAM_DEF_COMP_LZO
            ZRAM_DEF_COMP_LZ4
            ZRAM_DEF_COMP_LZ4HC
            ZRAM_DEF_COMP_ZSTD
            ZRAM_SIZE
          )
          for cfg in \
            AX6-IPQ/.config-stock \
            AX6-IPQ/.config-expand \
            AX6-IPQ/nss-extra.config; do
            for symbol in "${obsolete[@]}"; do
              if grep -Eq "^(# )?CONFIG_${symbol}(=| is not set)" "$cfg"; then
                echo "::error file=$cfg::obsolete or undefined symbol: CONFIG_${symbol}"
                exit 1
              fi
            done
          done
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand; do
            grep -qx 'CONFIG_ATH11K_MEM_PROFILE_512M=y' "$cfg" || {
              echo "::error file=$cfg::current ath11k NSS source requires the 512M memory profile"
              exit 1
            }
            if grep -q '^CONFIG_NSS_DRV_TRUSTSEC_RX_ENABLE=y$' "$cfg" &&
               ! grep -q '^CONFIG_NSS_DRV_TRUSTSEC_ENABLE=y$' "$cfg"; then
              echo "::error file=$cfg::TRUSTSEC_RX cannot be enabled while TRUSTSEC is disabled"
              exit 1
            fi
            grep -qx '# CONFIG_KERNEL_SKB_RECYCLER_PREALLOC is not set' "$cfg" || {
              echo "::error file=$cfg::SKB preallocation is documented by current source as SFE-only, not NSS"
              exit 1
            }
            duplicates=$(awk -F= '
              /^CONFIG_[A-Za-z0-9_]+=/ { count[$1]++ }
              END { for (key in count) if (count[key] > 1) print key }
            ' "$cfg")
            if [ -n "$duplicates" ]; then
              echo "::error file=$cfg::duplicate active config keys: $duplicates"
              exit 1
            fi
          done

      - name: AX6 NSS selected feed coverage check
        run: |
          set -eo pipefail
          workflow=.github/workflows/build-AX6-NSS.yml
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand; do
            if grep -q '^CONFIG_PACKAGE_kmod-qca-nss-nft=' "$cfg"; then
              echo "::error file=$cfg::kmod-qca-nss-nft is not defined by the locked source or NSS feed"
              exit 1
            fi
            grep -qx 'CONFIG_PACKAGE_sqm-scripts-nss=y' "$cfg" || continue
            # shellcheck disable=SC2016 # Match the workflow's literal lock-variable references.
            grep -Fq 'src-git sqm_scripts_nss ${SQM_SCRIPTS_NSS_URL}^${SQM_SCRIPTS_NSS_COMMIT}' "$workflow" || {
              echo "::error file=$workflow::sqm-scripts-nss is selected by $cfg but its locked feed is missing"
              exit 1
            }
            grep -qx 'CONFIG_PACKAGE_sqm-scripts=y' AX6-IPQ/nss-extra.config
            grep -qx 'CONFIG_PACKAGE_kmod-sched-cake=y' AX6-IPQ/nss-extra.config
          done

      - name: AX6 unwanted package guard
        run: |
          set -eo pipefail
          unwanted=(
            haproxy
            chinadns-ng
            dns2socks
            dns2tcp
            ipt2socks
            microsocks
            kmod-wireguard
            wireguard-tools
            luci-proto-wireguard
          )
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand AX6-IPQ/nss-extra.config; do
            for pkg in "${unwanted[@]}"; do
              if grep -qx "CONFIG_PACKAGE_${pkg}=y" "$cfg"; then
                echo "::error file=$cfg::unwanted or incomplete package selected: $pkg"
                exit 1
              fi
            done
          done

      - name: ZRAM config dependency check
        run: |
          set -eo pipefail
          required=(
            CONFIG_KERNEL_SWAP=y
            CONFIG_BUSYBOX_CONFIG_MKSWAP=y
            CONFIG_BUSYBOX_CONFIG_SWAPON=y
            CONFIG_BUSYBOX_CONFIG_FEATURE_SWAPON_DISCARD=y
            CONFIG_BUSYBOX_CONFIG_FEATURE_SWAPON_PRI=y
            CONFIG_BUSYBOX_CONFIG_SWAPOFF=y
            CONFIG_PACKAGE_kmod-zram=y
            CONFIG_KERNEL_ZRAM_BACKEND_ZSTD=y
            CONFIG_KERNEL_ZRAM_DEF_COMP_ZSTD=y
          )
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand; do
            grep -qx 'CONFIG_PACKAGE_zram-swap=y' "$cfg" || continue
            for symbol in "${required[@]}"; do
              grep -qx "$symbol" "$cfg" || {
                echo "::error file=$cfg::zram-swap requires $symbol"
                exit 1
              }
            done
          done
          grep -Fq "'etc/rc\\.d/S15zram'" .github/workflows/build-AX6-NSS.yml
          grep -Fq "'etc/rc\\.d/S15zram'" .github/workflows/build-AX6-IPQ.yml
          zram_defaults=AX6-IPQ/files/etc/uci-defaults/95-ax6-zram-defaults
          grep -Fq "zram_size_mb='256'" "$zram_defaults"
          grep -Fq "zram_comp_algo='zstd'" "$zram_defaults"
          grep -Fq 'system.@system[0].zram_size_mb' AX6-IPQ/files/sbin/nss-check
          grep -Fq 'system.@system[0].zram_comp_algo' AX6-IPQ/files/sbin/nss-check

      - name: ECM offload policy check
        run: |
          set -eo pipefail
          tune=AX6-IPQ/files/etc/uci-defaults/98-nss-tune
          health=AX6-IPQ/files/sbin/nss-check
          br_hotplug=AX6-IPQ/files/etc/hotplug.d/net/100-disable_offloads_br_lan
          test -x "$tune"
          test -x "$health"
          test -x "$br_hotplug"
          grep -Fq "ecm.general.disable_offloads='1'" "$tune"
          grep -Fq "ecm.general.disable_gro_list='1'" "$tune"
          if grep -Eq "ecm\.general\.disable_flow_control='1'|disable_flow_control[[:space:]]*'1'" "$tune" AX6-IPQ/files/etc/uci-defaults/* 2>/dev/null; then
            echo "::error::Do not force Ethernet flow-control changes in defaults; validate per-link before enabling"
            exit 1
          fi
          grep -Fq 'ECM disable_offloads=1' "$health"
          grep -Fq 'ECM disable_gro_list=1' "$health"
          grep -Fq 'ECM disable_flow_control=' "$health"
          grep -Fq 'generic-receive-offload' "$health"
          grep -Fq 'generic-segmentation-offload' "$health"
          grep -Fq 'tcp-segmentation-offload' "$health"
          grep -Fq 'rx-gro-list' "$health"
          grep -Fq 'br-lan' "$health"
          grep -Fq 'disable_offloads.sh' "$br_hotplug"
          grep -Fq "disable_offload \"\$INTERFACE\"" "$br_hotplug"
          grep -Fq "[ \"\$INTERFACE\" = \"br-lan\" ]" "$br_hotplug"
          for workflow in .github/workflows/build-AX6-NSS.yml .github/workflows/build-AX6-IPQ.yml; do
            for required in \
              'etc/uci-defaults/98-nss-tune' \
              'etc/hotplug\.d/net/99-disable_offloads' \
              'etc/hotplug\.d/net/100-disable_offloads_br_lan' \
              'lib/netifd/offload/disable_offloads\.sh'; do
              grep -Fq "$required" "$workflow" || {
                echo "::error file=$workflow::final rootfs validation is missing $required"
                exit 1
              }
            done
          done

      - name: Kconfig assignment consistency check
        run: |
          set -eo pipefail
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand AX6-IPQ/nss-extra.config; do
            awk '
              function add(symbol, value) {
                if (!(symbol in stored)) {
                  stored[symbol] = value
                } else if (stored[symbol] != value) {
                  printf "%s has conflicting assignments: %s and %s\n",
                    symbol, stored[symbol], value > "/dev/stderr"
                  conflicts = 1
                }
              }
              /^CONFIG_[^=]+=/ {
                symbol = $0
                sub(/=.*/, "", symbol)
                value = $0
                sub(/^[^=]+=/, "", value)
                add(symbol, value)
                next
              }
              /^# CONFIG_.* is not set$/ {
                symbol = $0
                sub(/^# /, "", symbol)
                sub(/ is not set$/, "", symbol)
                add(symbol, "n")
              }
              END { exit conflicts }
            ' "$cfg" || {
              echo "::error file=$cfg::conflicting Kconfig assignments found"
              exit 1
            }
          done

      - name: Package repository ownership check
        run: |
          set -eo pipefail
          if [ -e AX6-IPQ/files/etc/opkg/distfeeds.conf ]; then
            if grep -Eq '^src/gz[[:space:]].*snapshots\.immortalwrt' AX6-IPQ/files/etc/opkg/distfeeds.conf; then
              echo "::error::overlay distfeeds.conf must not use /snapshots/ (APK-only, 404)"
              exit 1
            fi
          fi

      - name: WiFi compatibility defaults check
        run: |
          set -eo pipefail
          wifi=AX6-IPQ/files/etc/uci-defaults/99-ax6-wifi-tune
          regdom=AX6-IPQ/files/etc/init.d/ax6-wifi-regdom
          grep -qx 'COUNTRY="US"' "$wifi"
          grep -Fq 'COUNTRY_FILE="/etc/config/ax6_wifi_country"' "$regdom"
          grep -Fq "for radio in \$(uci -q show wireless" "$regdom"
          grep -Fq "wireless.\${radio}.country=\$country" "$regdom"
          grep -Fq "iw reg set \"\$country\"" "$regdom"
          grep -q 'htmode=HE40' "$wifi"
          grep -q 'ht_coex=1' "$wifi"
          grep -q 'channel=auto' "$wifi"
          grep -q 'htmode=HE80' "$wifi"
          ath11k_options=AX6-IPQ/files/etc/modprobe.d/ath11k.conf
          grep -Fq 'options ath11k frame_mode=2' "$ath11k_options"
          grep -Fq 'options ath11k nss_offload=1' "$ath11k_options"
          if grep -Eq '^[[:space:]]*options[[:space:]]+ath11k[[:space:]].*rx_hash=' "$ath11k_options"; then
            echo "::error file=$ath11k_options::backports 6.18.26 has no ath11k rx_hash module parameter"
            exit 1
          fi
          if grep -Eq 'uci([[:space:]]+-q)?[[:space:]]+set .*\\.(tx_antenna|rx_antenna)=' "$wifi"; then
            echo "::error file=$wifi::wifi-scripts uses txantenna/rxantenna; underscore antenna keys are ignored"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match the literal UCI template.
          if grep -Fq 'wireless.${radio}.dtim_period' "$wifi"; then
            echo "::error file=$wifi::dtim_period is a wifi-iface option and is ignored on wifi-device radio sections"
            exit 1
          fi
          for unsafe in \
            'noscan=1' \
            'isolate=0' \
            'proxy_arp=1' \
            'multicast_to_unicast=1'; do
            if grep -Fq "$unsafe" "$wifi"; then
              echo "::error file=$wifi::unsafe WiFi default found: $unsafe"
              exit 1
            fi
          done
          if grep -Rq 'wireless.*isolate=0' AX6-IPQ/files/etc/init.d; then
            echo "::error::boot services must not override SSID isolation policy"
            exit 1
          fi
          guard=AX6-IPQ/files/etc/init.d/ax6-boot-guard
          grep -Fq 'network.globals.packet_steering' "$guard"
          grep -Fq 'for option in flow_offloading flow_offloading_hw' "$guard"
          grep -Fq 'firewall.@defaults[0].' "$guard"
          grep -q 'ax6-config-audit' AX6-IPQ/files/sbin/nss-check
          if grep -RqE \
            'uci([[:space:]]+-q)?[[:space:]]+set "network\.\$\{d\}\.(packet_steering|flow_offloading|flow_offloading_hw)=0"' \
            AX6-IPQ/files/etc/init.d AX6-IPQ/files/etc/uci-defaults; then
            echo "::error::device-level packet steering/flow offload options are not consumed by netifd or firewall4"
            exit 1
          fi

      - name: Scenario policy ownership check
        run: |
          set -eo pipefail
          audit=AX6-IPQ/files/sbin/ax6-config-audit
          vlan=AX6-IPQ/files/sbin/vlan-add
          zt_fw4=AX6-IPQ/files/usr/bin/zerotier-fw4
          test -x "$audit"
          test -x "$vlan"
          test -x "$zt_fw4"
          if grep -Eq 'uci[[:space:]].*(set|delete|del|commit)|/etc/init\.d/.*(restart|reload)' "$audit"; then
            echo "::error file=$audit::scenario audit must remain read-only"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match the audit helper's literal UCI expression.
          for required in \
            '/var/run/zerotier-one/_fw4/input.nft' \
            '/var/run/zerotier-one/_fw4/forward.nft' \
            '/var/run/zerotier-one/_fw4/srcnat.nft' \
            'firewall.${_zt_section}.position' \
            'zerotier_input_ports_match' \
            'vlan_filtering=1 conflicts with qosmio NSS WiFi offload guidance' \
            'config bridge-vlan is present' \
            'openclash_dns_redirect' \
            'OpenClash DNS Hijack' \
            'GeoIP/GeoSite/ASN use' \
            'enabled on ${oc_overlay_total} KiB overlay can refill flash' \
            'dashboard UI files occupy' \
            'fake-ip cache persistence enabled' \
            'custom DNS nameserver group is configured' \
            'default DNS is IPv4-only with disable_ipv6=1' \
            'subscription DNS owns nameserver/default-nameserver'; do
            grep -Fq "$required" "$audit" || {
              echo "::error file=$audit::scenario audit is missing runtime check: $required"
              exit 1
            }
          done
          if grep -RqE \
            'upnpd\.config\.enabled=|zerotier\..*fw_allow_|openclash\.config\.|wireless\..*isolate=|=bridge-vlan|vlan_filtering' \
            AX6-IPQ/files/etc/init.d AX6-IPQ/files/etc/uci-defaults; then
            echo "::error::boot/default scripts must not force scenario-dependent service policy"
            exit 1
          fi
          grep -Fq "grep -q '=bridge-vlan'" "$vlan"
          grep -Fq '@.config.settings.tertiaryPort' "$zt_fw4"
          grep -Fq '@.config.settings.listeningOn[*]' "$zt_fw4"
          grep -Fq 'drop_stale_port_rules' "$zt_fw4"
          grep -Fq 'fw4 reload' "$zt_fw4"
          for workflow in .github/workflows/build-AX6-NSS.yml .github/workflows/build-AX6-IPQ.yml; do
            grep -Fq "'usr/bin/zerotier-fw4'" "$workflow"
          done
          # shellcheck disable=SC2016 # Match vlan-add literal awk field reference.
          grep -Fq '/=zone$/{print $2}' "$vlan"
          grep -Fq "firewall zone named" "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.$NAME=zone' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.$NAME.input=REJECT' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.${NAME}_wan=forwarding' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.${NAME}_dns=rule' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.${NAME}_dhcp=rule' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set dhcp.$NAME=dhcp' "$vlan"
          # shellcheck disable=SC2016 # Match the literal transaction guard.
          grep -Fq 'uci -q changes "$package"' "$vlan"
          grep -Fq 'configuration failed; network, firewall and DHCP files were restored' "$vlan"
          # shellcheck disable=SC2016 # Reject an unsafe literal UCI template.
          if grep -Fq 'set firewall.$NAME.input=ACCEPT' "$vlan"; then
            echo "::error file=$vlan::new untrusted VLANs must not expose router services by default"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          if grep -Eq 'set network\.br_\$NAME\.vlan_filtering=' "$vlan"; then
            echo "::error file=$vlan::802.1q helper must not generate bridge VLAN filtering fields"
            exit 1
          fi

      - name: Router maintenance script safety check
        run: |
          set -eo pipefail
          backup="backup-router-config.sh"
          deploy="deploy-openclash-runtime.sh"
          test -x "$backup"
          test -x "$deploy"
          grep -Fq 'sysupgrade-config-backup.tar.gz' "$backup"
          grep -Fq 'openclash-runtime.tar.gz' "$backup"
          grep -Fq 'openclash-runtime.tar.gz' "$deploy"
          grep -Fq 'OpenClash archive contains paths outside the restore allowlist' "$deploy"
          grep -Fq 'OpenClash archive contains links or special files' "$deploy"
          grep -Fq 'rollback_on_error' "$deploy"
          grep -Fq 'previous OpenClash state restored' "$deploy"
          grep -Fq 'OpenClash core: disabled by restored configuration' "$deploy"
          grep -Fq 'The complete sysupgrade archive was not restored automatically.' "$deploy"
          grep -Fq 'ax6-backup-*/' .gitignore
          if grep -Eq 'el1si7d_doggygosubs|head -[0-9]+ /etc/openclash/config' "$backup" "$deploy"; then
            echo "::error::router maintenance scripts must not hard-code a subscription filename or truncate backups"
            exit 1
          fi
          grep -Fq 'blacklist nf_flow_table' AX6-IPQ/files/etc/modprobe.d/nss-no-flow.conf

      - name: Build dependency installation policy check
        run: |
          set -eo pipefail
          for workflow in \
            .github/workflows/build-AX6-IPQ.yml \
            .github/workflows/build-AX6-NSS.yml \
            .github/workflows/build-IMM.yml \
            .github/workflows/build-LEDE.yml; do
            grep -Fq -- '--no-install-recommends' "$workflow"
            grep -Fq 'Acquire::Retries=3' "$workflow"
            if grep -Eq 'apt-get .*autoremove' "$workflow"; then
              echo "::error file=$workflow::do not autoremove runner packages after installing build dependencies"
              exit 1
            fi
          done
          grep -Fq 'large-packages: false' .github/workflows/build-AX6-NSS.yml

      - name: IRQ policy ownership check
        run: |
          set -eo pipefail
          health=AX6-IPQ/files/sbin/nss-check
          for required in \
            S26qca-nss-ecm \
            S19qca-nss-pbuf \
            S28qca-nss-drv \
            S29qca-nss-netlink \
            S93smp_affinity \
            S99set-irq-affinity; do
            grep -Fq "$required" "$health" || {
              echo "::error file=$health::runtime health check is missing startup link $required"
              exit 1
            }
          done
          if [ -e AX6-IPQ/files/etc/init.d/ax6-irq-affinity ] || \
             grep -R -n -E \
               'S[0-9]+ax6-irq-affinity|ax6-irq-affinity (apply|reload|restart)' \
               AX6-IPQ/diy.sh AX6-IPQ/files/etc/hotplug.d AX6-IPQ/files/etc/rc.d 2>/dev/null; then
            echo "::error::custom AX6 IRQ policy must remain manual and must not override upstream"
            exit 1
          fi
          test -x AX6-IPQ/files/usr/sbin/ax6-irq-affinity

      - name: NSS pbuf runtime application check
        run: |
          set -eo pipefail
          diy=AX6-IPQ/diy.sh
          health=AX6-IPQ/files/sbin/nss-check
          if grep -Eq 'ath11k_sysfs_device_available|wait_for_ath11k_nss_offload|wait_for_nss_sysctls|qca-nss-pbuf.init: n2h sysctl order mismatch' "$diy"; then
            echo "::error file=$diy::qca-nss-pbuf must be fixed in SOURCE_COMMIT, not patched in diy.sh"
            exit 1
          fi
          for required in \
            'NSS pbuf/N2H profile applied' \
            'NSS EDMA alloc-fail growth is stable' \
            edma_err_alloc_fail_cnt \
            n2h_wifi_pool_buf; do
            grep -Fq "$required" "$health" || {
              echo "::error file=$health::runtime health check is missing $required"
              exit 1
            }
          done

      - name: NSS .config conflict check (merged with nss-extra)
        run: |
          set -eo pipefail
          python3 - <<'PY'
          """模拟 workflow 的 `cat nss-extra.config >> .config` 后,
          检查 NSS 互斥包是否同时启用,并提示缺失的推荐包。
          """
          import glob
          import os
          import re
          import sys

          # NSS 互斥对:同一行同时 =y 即报错
          NSS_CONFLICT = (
              ('kmod-qca-nss-drv', 'kmod-nf-flow'),
              ('kmod-qca-nss-drv', 'kmod-ipt-offload'),
              ('kmod-qca-nss-drv', 'kmod-nft-offload'),
              ('kmod-qca-nss-drv', 'kmod-fast-classifier'),
              ('kmod-qca-nss-drv', 'kmod-shortcut-fe'),
              ('kmod-qca-nss-drv', 'kmod-shortcut-fe-cm'),
          )
          # 推荐启用的包。ATH11K_NSS_SUPPORT 不是 PACKAGE_ 符号，由前面的
          # locked-source/config checks 单独验证。
          NSS_RECOMMENDED_PACKAGES = (
              'kmod-qca-ssdk',
          )
          NSS_EXTRA = 'AX6-IPQ/nss-extra.config'

          PAT_Y = re.compile(r'^CONFIG_(PACKAGE_[\w-]+)=([ymn])$')
          PAT_N = re.compile(r'^# CONFIG_(PACKAGE_[\w-]+) is not set$')


          def parse_config(path):
              """读取 OpenWrt .config,返回 {symbol: 'y'|'n'} 字典。"""
              result = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      m = PAT_Y.match(line)
                      if m:
                          result[m.group(1)] = m.group(2)
                          continue
                      m = PAT_N.match(line)
                      if m:
                          result[m.group(1)] = 'n'
              return result


          def main():
              extra = parse_config(NSS_EXTRA) if os.path.exists(NSS_EXTRA) else {}
              fail_count = 0

              for cfg in sorted(glob.glob('AX6-IPQ/.config*')):
                  if cfg == NSS_EXTRA:
                      continue
                  merged = parse_config(cfg)
                  # 模拟 workflow `cat nss-extra.config >> .config`(后写覆盖)
                  merged.update(extra)

                  if merged.get('PACKAGE_kmod-qca-nss-drv') != 'y':
                      print(f'::notice file={cfg}::no NSS, skip')
                      continue

                  for a, b in NSS_CONFLICT:
                      if merged.get(f'PACKAGE_{a}') == 'y' and merged.get(f'PACKAGE_{b}') == 'y':
                          print(
                              f'::error file={cfg}::CONFLICT (after nss-extra merge) '
                              f'PACKAGE_{a}=y AND PACKAGE_{b}=y'
                          )
                          fail_count += 1

                  for need in NSS_RECOMMENDED_PACKAGES:
                      if merged.get(f'PACKAGE_{need}') != 'y':
                          print(
                              f'::warning file={cfg}::missing recommended '
                              f'PACKAGE_{need}=y'
                          )

              return 1 if fail_count else 0


          sys.exit(main())
          PY
