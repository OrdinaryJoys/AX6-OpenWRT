      - name: IPv4 interface invariant check
        run: |
          set -eo pipefail
          sysctl_file=AX6-IPQ/files/etc/sysctl.d/99-ax6-tune.conf
          helper=AX6-IPQ/files/usr/sbin/ax6-network-invariants
          service=AX6-IPQ/files/etc/init.d/ax6-network-invariants
          hotplug=AX6-IPQ/files/etc/hotplug.d/net/90-ax6-network-invariants
          for file in "$helper" "$service" "$hotplug"; do
            test -x "$file"
          done
          for setting in \
            net.ipv4.conf.all.send_redirects=0 \
            net.ipv4.conf.default.send_redirects=0 \
            net.ipv4.conf.all.accept_redirects=0 \
            net.ipv4.conf.default.accept_redirects=0 \
            net.ipv4.conf.all.arp_ignore=1 \
            net.ipv4.conf.default.arp_ignore=1; do
            grep -Fqx "$setting" "$sysctl_file"
          done
          grep -Fq 'send_redirects:0' "$helper"
          grep -Fq 'accept_redirects:0' "$helper"
          grep -Fq 'arp_ignore:1' "$helper"
          grep -Fq '/usr/sbin/ax6-network-invariants --all' "$service"
          grep -Fq '. /lib/netifd/offload/disable_offloads.sh' "$service"
          grep -Fqx '        disable_offload' "$service"
          if grep -Eq '^[[:space:]]*disable_offload[[:space:]]+br-lan[[:space:]]*$' "$service"; then
            echo "::error file=$service::parameterless helper already includes configured br-lan; do not process it twice"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match the hotplug script's literal environment variable.
          grep -Fq '/usr/sbin/ax6-network-invariants "$INTERFACE"' "$hotplug"
          grep -Fq 'S95ax6-network-invariants' AX6-IPQ/diy.sh
          for workflow in .github/workflows/build-AX6-NSS.yml .github/workflows/build-AX6-IPQ.yml; do
            for required in \
              'etc/init\.d/ax6-network-invariants' \
              'etc/hotplug\.d/net/90-ax6-network-invariants' \
              'usr/sbin/ax6-network-invariants' \
              'etc/rc\.d/S95ax6-network-invariants'; do
              grep -Fq "$required" "$workflow" || {
                echo "::error file=$workflow::final rootfs validation is missing $required"
                exit 1
              }
            done
          done

      - name: Kconfig assignment consistency check
        run: |
          set -eo pipefail
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand AX6-IPQ/nss-extra.config; do
            awk '
              function add(symbol, value) {
                if (!(symbol in stored)) {
                  stored[symbol] = value
                } else if (stored[symbol] != value) {
                  printf "%s has conflicting assignments: %s and %s\n",
                    symbol, stored[symbol], value > "/dev/stderr"
                  conflicts = 1
                }
              }
              /^CONFIG_[^=]+=/ {
                symbol = $0
                sub(/=.*/, "", symbol)
                value = $0
                sub(/^[^=]+=/, "", value)
                add(symbol, value)
                next
              }
              /^# CONFIG_.* is not set$/ {
                symbol = $0
                sub(/^# /, "", symbol)
                sub(/ is not set$/, "", symbol)
                add(symbol, "n")
              }
              END { exit conflicts }
            ' "$cfg" || {
              echo "::error file=$cfg::conflicting Kconfig assignments found"
              exit 1
            }
          done

      - name: Package repository ownership check
