# yamllint disable rule:line-length
name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install tools
        run: |
          set -eo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y device-tree-compiler shellcheck yamllint
          # actionlint
          bash <(curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.0
          sudo mv actionlint /usr/local/bin/

      - name: Shellcheck (errors only block)
        run: |
          set -eo pipefail
          find . -type f \( -name "*.sh" -o -path "*/uci-defaults/*" -o -path "*/hotplug.d/*" -o -path "*/sbin/*" -o -path "*/usr/sbin/*" -o -path "*/usr/bin/*" \) ! -path "./.git/*" -print0 | \
            xargs -0 -P4 shellcheck -S error -f gcc
          sh tests/test-vlan-add.sh
          sh tests/test-openvpn-defaults.sh
          sh tests/test-openclash-dns-health.sh
          sh tests/test-openclash-archive.sh
          sh tests/test-router-backup.sh
          sh tests/test-router-restore-preflight.sh
          sh tests/test-openclash-runtime-contract.sh
          sh tests/test-openclash-rom-core-guard.sh
          sh tests/test-openclash-keep-policy.sh
          sh tests/test-device-manifest.sh
          sh tests/test-zerotier-fw4.sh
          sh tests/test-zerotier-reconcile.sh
          sh tests/test-zerotier-health.sh
          sh tests/test-zerotier-buffer-patch.sh
          sh tests/test-cgi-io-security-backport.sh
          sh tests/test-openclash-zerotier-bypass.sh
          sh tests/test-ax6-config-audit-zerotier.sh
          sh tests/test-ax6-boot-guard.sh
          sh tests/test-ax6-stock-compiled-dtb.sh
          sh tests/test-pbuf-fixture.sh
          sh tests/test-nss-monitor.sh
          sh tests/test-source-patchset-generator.sh
          sh AX6-IPQ/tests/test-source-semantic-lock.sh
          bash AX6-IPQ/tests/test-ax6-perf-fixture.sh
          bash AX6-IPQ/tests/test-ax6-perf-tool-hardening.sh
          bash AX6-IPQ/tests/test-ax6-offline-feed-package.sh
          sh AX6-IPQ/tests/test-ax6-routed-perf-fixture.sh
          sh AX6-IPQ/tests/test-ax6-nss-frequency-ab.sh
          sh AX6-IPQ/tests/test-ax6-reload-matrix-validate.sh
          sh AX6-IPQ/tests/test-ax6-udp-baseline-fixture.sh

      - name: Actionlint
        run: actionlint -color .github/workflows/*.yml

      - name: Yamllint (relaxed)
        run: yamllint -d relaxed .github/

      - name: Release tag provenance check
        run: |
          set -eo pipefail
          while IFS= read -r workflow; do
            if ! grep -Eq 'commit: .*github.sha' "$workflow"; then
              echo "::error file=$workflow::release-action must tag the workflow commit"
              exit 1
            fi
          done < <(grep -Rl 'uses: ncipollo/release-action@' .github/workflows)
          workflow=.github/workflows/build-AX6-NSS.yml
          grep -Fq 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$workflow"
          test "$(grep -F 'if: github.ref ==' "$workflow" | grep -Fc 'refs/heads/main')" -eq 2
          for workflow in \
            .github/workflows/build-AX6-IPQ.yml \
            .github/workflows/build-IMM.yml \
            .github/workflows/build-LEDE.yml; do
            if grep -Fq 'uses: ncipollo/release-action@' "$workflow"; then
              echo "::error file=$workflow::unlocked backup workflows must not publish Releases"
              exit 1
            fi
            grep -Fq 'UNVALIDATED_' "$workflow" || {
              echo "::error file=$workflow::backup artifact must include UNVALIDATED_ marker"
              exit 1
            }
          done

      - name: STOCK image safety policy
        run: |
          set -eo pipefail
          workflow=.github/workflows/build-AX6-NSS.yml
          grep -Fq "stock_partition_size=\$((0x06640000))" "$workflow"
          grep -Fq "stock_ubi_limit=\$((0x06340000))" "$workflow"
          grep -Fq 'xiaomi_stock_check_image_size' "$workflow"
          grep -Fq 'upload/upgrade/*' "$workflow"
          grep -Fq 'path: upload/recovery/*' "$workflow"
          grep -Fq 'AX6-IPQ/scripts/package-ax6-offline-feed.sh' "$workflow"
          grep -Fq 'KMOD-ARCHIVE-SHA256.txt' \
            AX6-IPQ/scripts/package-ax6-offline-feed.sh

          if grep -Eq 'nand (erase|write).*rootfs|fastboot flash rootfs' \
            "$workflow" AX6-IPQ/HARDWARE.md; then
            echo "::error::Generic raw rootfs flashing commands are forbidden"
            exit 1
          fi

          grep -Fq 'SMEM/custom U-Boot merged rootfs' AX6-IPQ/files/sbin/nss-check
          grep -Fq '06640000' AX6-IPQ/HARDWARE.md

      - name: STOCK and EXPAND config difference allowlist
        run: |
          python3 - <<'PY'
          import re
          import sys


          def parse(path):
              values = {}
              with open(path) as stream:
                  for raw in stream:
                      line = raw.strip()
                      match = re.match(r'^(CONFIG_[A-Za-z0-9_-]+)=(.*)$', line)
                      if match:
                          values[match.group(1)] = match.group(2)
                          continue
                      match = re.match(
                          r'^# (CONFIG_[A-Za-z0-9_-]+) is not set$', line
                      )
                      if match:
                          values[match.group(1)] = 'n'
              return values


          allowed = {
              'CONFIG_TARGET_PROFILE',
              'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6',
              'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock',
          }
          stock = parse('AX6-IPQ/.config-stock')
          expand = parse('AX6-IPQ/.config-expand')
          unexpected = [
              symbol
              for symbol in sorted(set(stock) | set(expand))
              if stock.get(symbol) != expand.get(symbol) and symbol not in allowed
          ]
          if unexpected:
              print(
                  '::error::Unexpected STOCK/EXPAND config differences: '
                  + ' '.join(unexpected)
              )
              sys.exit(1)
          PY

      - name: AX6 NSS build lock check
        run: |
          set -eo pipefail
          set -a
          . .github/ax6-nss-lock.env
          set +a
          for name in \
            SOURCE_REPO SOURCE_TRACKING_BRANCH SOURCE_BASE_COMMIT SOURCE_COMMIT \
            SOURCE_PATCHSET_MANIFEST_SHA256 \
            SQM_SCRIPTS_NSS_URL SQM_SCRIPTS_NSS_COMMIT \
            LUCI_FEED_URL LUCI_FEED_TRACKING_BRANCH LUCI_FEED_COMMIT \
            PACKAGES_FEED_URL PACKAGES_FEED_COMMIT PACKAGES_FEED_POLICY \
            CGI_IO_SECURITY_BACKPORT_COMMIT \
            ROUTING_FEED_URL ROUTING_FEED_COMMIT \
            TELEPHONY_FEED_URL TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_URL VIDEO_FEED_COMMIT \
            ARGON_THEME_URL ARGON_THEME_COMMIT \
            ARGON_CONFIG_URL ARGON_CONFIG_COMMIT \
            OPENCLASH_URL OPENCLASH_REF \
            SOURCE_HOSTAPD_PKG_RELEASE SOURCE_QCA_NSS_DRV_PKG_RELEASE \
            SOURCE_QCA_NSS_ECM_PKG_RELEASE SOURCE_QCA_NSS_CLIENTS_PKG_RELEASE \
            SOURCE_QCA_MCS_PKG_RELEASE; do
            value="${!name:-}"
            [ -n "$value" ] || {
              echo "::error::$name is missing from .github/ax6-nss-lock.env"
              exit 1
            }
          done
          for name in \
            SOURCE_BASE_COMMIT SOURCE_COMMIT SQM_SCRIPTS_NSS_COMMIT LUCI_FEED_COMMIT \
            PACKAGES_FEED_COMMIT CGI_IO_SECURITY_BACKPORT_COMMIT \
            ROUTING_FEED_COMMIT TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_COMMIT ARGON_THEME_COMMIT ARGON_CONFIG_COMMIT; do
            value="${!name}"
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::$name must be a full 40-character lowercase commit SHA"
              exit 1
            }
          done
          for name in \
            SOURCE_HOSTAPD_PKG_RELEASE SOURCE_QCA_NSS_DRV_PKG_RELEASE \
            SOURCE_QCA_NSS_ECM_PKG_RELEASE SOURCE_QCA_NSS_CLIENTS_PKG_RELEASE \
            SOURCE_QCA_MCS_PKG_RELEASE; do
            value="${!name}"
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::$name must be a positive integer (got '$value')"
              exit 1
            fi
            if [ "$value" -le 0 ]; then
              echo "::error::$name must be a positive integer (got '$value')"
              exit 1
            fi
          done
          [[ "$SOURCE_PATCHSET_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::SOURCE_PATCHSET_MANIFEST_SHA256 must be a 64-character lowercase SHA256"
            exit 1
          }
          [ "$PACKAGES_FEED_POLICY" = compatible-security-backport ] || {
            echo "::error::unexpected packages feed policy: $PACKAGES_FEED_POLICY"
            exit 1
          }
          [ "$PACKAGES_FEED_COMMIT" = 4db836e2d929b5f0d858000f99aa55bb0ab85100 ] || {
            echo "::error::packages compatibility lock changed without a reviewed defconfig result"
            exit 1
          }
          backport=AX6-IPQ/package-patches/cgi-io/100-fix-malformed-post-use-after-free.patch
          grep -Fq "$CGI_IO_SECURITY_BACKPORT_COMMIT" "$backport" || {
            echo "::error file=$backport::cgi-io package backport provenance does not match the build lock"
            exit 1
          }
          grep -Fq '31cb3c89f02d918d7f17bf62a80c852fc38a1ca1' "$backport" || {
            echo "::error file=$backport::fixed cgi-io source revision is missing"
            exit 1
          }
          case "$SOURCE_TRACKING_BRANCH" in
            codex/*|rc-safe/*|rc-perf/*|fix/*|build/*)
              ;;
            *)
              echo "::error::unexpected source tracking branch: $SOURCE_TRACKING_BRANCH (expected codex/*, rc-safe/*, rc-perf/*, fix/*, or build/*)"
              exit 1
              ;;
          esac
          actual_patchset_manifest_sha=$(sha256sum .github/ax6-source-patchset.sha256)
          actual_patchset_manifest_sha=${actual_patchset_manifest_sha%% *}
          [ "$actual_patchset_manifest_sha" = "$SOURCE_PATCHSET_MANIFEST_SHA256" ] || {
            echo "::error::source patchset manifest hash mismatch"
            exit 1
          }
          workflow=.github/workflows/build-AX6-NSS.yml
          for source_gate in \
            'AX6 source must use Linux 6.18.38' \
            'Linux 6.18.38 archive hash is missing or incorrect' \
            'missing hostapd 2026-1 security fix' \
            'missing bridge-port on-wire VLAN decision' \
            'missing NSS-DP MAC synchronization fix' \
            'missing outer EAP method mapping' \
            'wifi ucode helper lost its executable mode' \
            'missing ath11k recovery guard'; do
            grep -Fq "$source_gate" "$workflow" || {
              echo "::error file=$workflow::missing locked-source semantic gate: $source_gate"
              exit 1
            }
          done
          grep -Fq 'verify-ax6-source-semantics.sh' "$workflow" || {
            echo "::error file=$workflow::build workflow must call the shared source semantic verifier"
            exit 1
          }
          # Release values live in the lock; hardcoded PKG_RELEASE or
          # 'release must be N' strings in the workflow are forbidden (P0-4).
          if grep -Eq "PKG_RELEASE:=[0-9]+|release must be [0-9]+" "$workflow"; then
            echo "::error file=$workflow::package release must come from the lock, not hardcoded strings"
            exit 1
          fi
          sh -n .github/scripts/verify-ax6-source-semantics.sh || {
            echo "::error::verify-ax6-source-semantics.sh has a shell syntax error"
            exit 1
          }
          grep -Fq 'CONFIG_ATH11K_NSS_MESH_SUPPORT) += ATH11K_NSS_MESH_SUPPORT' "$workflow"
          grep -Fq 'CONFIG_ATH11K_NSS_SUPPORT) += ATH11K_NSS_SUPPORT' "$workflow"
          grep -Fq 'ATH11K_NSS_SUPPORT must not force ATH11K_NSS_MESH_SUPPORT' "$workflow"
          # shellcheck disable=SC2016 # Match literal build-time OpenClash resolution.
          grep -Fq 'OPENCLASH_RESOLVED_COMMIT=$(resolve_branch_commit "$OPENCLASH_URL" "${OPENCLASH_REF:-master}")' AX6-IPQ/diy.sh
          # shellcheck disable=SC2016 # Match literal immutable checkout command.
          grep -Fq 'clone_locked "$OPENCLASH_URL" "$OPENCLASH_RESOLVED_COMMIT" package/luci-app-openclash-source' AX6-IPQ/diy.sh
          # shellcheck disable=SC2016 # Match literal resolved/actual equality gate.
          grep -Fq '[ "$OPENCLASH_ACTUAL_COMMIT" = "$OPENCLASH_RESOLVED_COMMIT" ]' AX6-IPQ/diy.sh
          if grep -Eq 'OPENCLASH_(COMMIT|VERSION)' .github/ax6-nss-lock.env AX6-IPQ/diy.sh; then
            echo "::error::OpenClash plugin must track upstream ref, not a pinned plugin version"
            exit 1
          fi
          expected_openclash_keep=$(printf '%s\n' \
            /etc/openclash/config/ \
            /etc/openclash/custom/ \
            /etc/openclash/overwrite/)
          actual_openclash_keep=$(cat AX6-IPQ/files/lib/upgrade/keep.d/luci-app-openclash)
          if [ "$actual_openclash_keep" != "$expected_openclash_keep" ]; then
            echo "::error::OpenClash sysupgrade keep policy must be exactly config/custom/overwrite"
            exit 1
          fi
          grep -Fqx '/etc/openclash/config/' AX6-IPQ/files/etc/sysupgrade.conf
          if grep -Fqx '/etc/openclash/' AX6-IPQ/files/etc/sysupgrade.conf; then
            echo "::error::AX6 sysupgrade policy must not retain the complete OpenClash runtime tree"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match the literal command substitution in diy.sh.
          capture_line=$(grep -nF 'OPENCLASH_ACTUAL_COMMIT=$(git -C package/luci-app-openclash-source rev-parse HEAD)' AX6-IPQ/diy.sh | cut -d: -f1)
          move_line=$(grep -nF 'mv package/luci-app-openclash-source/luci-app-openclash package/luci-app-openclash' AX6-IPQ/diy.sh | cut -d: -f1)
          if [ -z "$capture_line" ] || [ -z "$move_line" ] || [ "$capture_line" -ge "$move_line" ]; then
            echo "::error::OpenClash commit must be captured before its source repository is removed"
            exit 1
          fi
          grep -Fq '} > .openclash-build.env' AX6-IPQ/diy.sh
          # shellcheck disable=SC2016 # Match literal target_dir workflow code.
          for workflow in \
            .github/workflows/build-AX6-NSS.yml \
            .github/workflows/build-AX6-IPQ.yml; do
            for required in \
              'Verify tracked OpenClash inputs' \
              'OPENCLASH_ACTUAL_VERSION' \
              'OPENCLASH_RESOLVED_COMMIT' \
              'OPENCLASH_ACTUAL_COMMIT' \
              'OPENCLASH_CORE_COMMIT' \
              'OPENCLASH_CORE_SHA256' \
              'METACUBEXD_REPO' \
              'METACUBEXD_REF' \
              'METACUBEXD_COMMIT' \
              'METACUBEXD_ARCHIVE_SHA256' \
              'ZASHBOARD_REPO' \
              'ZASHBOARD_REF' \
              'ZASHBOARD_COMMIT' \
              'ZASHBOARD_ARCHIVE_SHA256' \
              'etc/openclash/core/clash_meta' \
              'lib/upgrade/keep.d/luci-app-openclash' \
              'Final rootfs OpenClash keep policy is not config/custom/overwrite' \
              'enforce-openclash-keep-policy.sh check' \
              'Final rootfs sysupgrade policy differs from the reviewed AX6 policy' \
              'usr/share/openclash/ui/metacubexd/index\.html' \
              'usr/share/openclash/ui/zashboard/index\.html' \
              'verify-device-manifest.sh' \
              'find "$target_dir" -maxdepth 1' \
              'DEVICE_MANIFEST_FILE' \
              'DEVICE_MANIFEST_SHA256'; do
              grep -Fq "$required" "$workflow" || {
                echo "::error file=$workflow::missing OpenClash provenance gate: $required"
                exit 1
              }
            done
          done

      - name: Obsolete NSS config symbol check
        run: |
          set -eo pipefail
          obsolete=(
            ATH11K_NSS_TX_SUPPORT
            ATH11K_TX_QUEUE_SIZE
            ATH11K_NSS_4ADDR_SUPPORT
            ATH11K_MEM_PROFILE_1G
            ATH11K_MEM_PROFILE_256M
            ATH11K_NAPI_WEIGHT_1G
            ARM_PSCI_CPUIDLE
            ARM_PSCI_CPUIDLE_DOMAIN
            CPU_FREQ_MIN
            IPQ_MEM_PROFILE_1024
            IPQ_MEM_PROFILE_512
            IPQ_MEM_PROFILE_256
            KERNEL_IPQ_MEM_PROFILE
            KERNEL_BRIDGE_NETFILTER
            KERNEL_BRIDGE_NF_EBTABLES
            KERNEL_NET_RX_BUSY_POLL
            MAC80211_RC_DEFAULT_MINSTREL_HT
            MAC80211_RC_DEFAULT_MINSTREL_VHT
            MAC80211_RC_MINSTREL_VHT_AUTOFALLBACK
            NSS_DRV_C2C_ENABLE
            NSS_DRV_CAPWAP_ENABLE
            NSS_DRV_CLMAP_ENABLE
            NSS_DRV_IPV4_FORWARD_ENABLE
            NSS_DRV_IPV6_FORWARD_ENABLE
            NSS_DRV_IPV6_REDIRECT
            NSS_DRV_CONNTRACK_ENABLE
            NSS_DRV_DEBUG
            NSS_DRV_DTLS_ENABLE
            NSS_DRV_IPSEC_ENABLE
            NSS_DRV_OAM_ENABLE
            NSS_DRV_PVXLAN_ENABLE
            NSS_DRV_QVPN_ENABLE
            NSS_DRV_SFE_ENABLE
            NSS_DRV_TLS_ENABLE
            NSS_DRV_TSTAMP_ENABLE
            NSS_DRV_WDS_ENABLE
            NSS_DRV_WIFI_LEGACY_ENABLE
            NSS_DRV_NATP_ENABLE
            NSS_DRV_PORTID_ENABLE
            NSS_MEM_PROFILE_HIGH
            NSS_MEM_PROFILE_MEDIUM
            NSS_MEM_PROFILE_LOW
            NSS_MEM_PROFILE_HIGH_PERF
            NSS_PPE_QSZ_4096
            PACKAGE_MAC80211_NSS_SUPPORT
            REGULATOR_FIXED_VOLTAGE
            SERIAL_8250_RUNTIME_UARTS
            ZRAM_DEF_COMP_LZORLE
            ZRAM_DEF_COMP_LZO
            ZRAM_DEF_COMP_LZ4
            ZRAM_DEF_COMP_LZ4HC
            ZRAM_DEF_COMP_ZSTD
            ZRAM_SIZE
          )
          for cfg in \
            AX6-IPQ/.config-stock \
            AX6-IPQ/.config-expand \
            AX6-IPQ/nss-extra.config; do
            for symbol in "${obsolete[@]}"; do
              if grep -Eq "^(# )?CONFIG_${symbol}(=| is not set)" "$cfg"; then
                echo "::error file=$cfg::obsolete or undefined symbol: CONFIG_${symbol}"
                exit 1
              fi
            done
          done
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand; do
            grep -qx 'CONFIG_ATH11K_MEM_PROFILE_512M=y' "$cfg" || {
              echo "::error file=$cfg::current ath11k NSS source requires the 512M memory profile"
              exit 1
            }
            if grep -q '^CONFIG_NSS_DRV_TRUSTSEC_RX_ENABLE=y$' "$cfg" &&
               ! grep -q '^CONFIG_NSS_DRV_TRUSTSEC_ENABLE=y$' "$cfg"; then
              echo "::error file=$cfg::TRUSTSEC_RX cannot be enabled while TRUSTSEC is disabled"
              exit 1
            fi
            grep -qx '# CONFIG_KERNEL_SKB_RECYCLER_PREALLOC is not set' "$cfg" || {
              echo "::error file=$cfg::SKB preallocation is documented by current source as SFE-only, not NSS"
              exit 1
            }
            duplicates=$(awk -F= '
              /^CONFIG_[A-Za-z0-9_]+=/ { count[$1]++ }
              END { for (key in count) if (count[key] > 1) print key }
            ' "$cfg")
            if [ -n "$duplicates" ]; then
              echo "::error file=$cfg::duplicate active config keys: $duplicates"
              exit 1
            fi
          done

      - name: AX6 NSS selected feed coverage check
        run: |
          set -eo pipefail
          workflow=.github/workflows/build-AX6-NSS.yml
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand; do
            if grep -q '^CONFIG_PACKAGE_kmod-qca-nss-nft=' "$cfg"; then
              echo "::error file=$cfg::kmod-qca-nss-nft is not defined by the locked source or NSS feed"
              exit 1
            fi
            grep -qx 'CONFIG_PACKAGE_sqm-scripts-nss=y' "$cfg" || continue
            # shellcheck disable=SC2016 # Match the workflow's literal lock-variable references.
            grep -Fq 'src-git sqm_scripts_nss ${SQM_SCRIPTS_NSS_URL}^${SQM_SCRIPTS_NSS_COMMIT}' "$workflow" || {
              echo "::error file=$workflow::sqm-scripts-nss is selected by $cfg but its locked feed is missing"
              exit 1
            }
            grep -qx 'CONFIG_PACKAGE_sqm-scripts=y' AX6-IPQ/nss-extra.config
            grep -qx 'CONFIG_PACKAGE_kmod-sched-cake=y' AX6-IPQ/nss-extra.config
          done

      - name: AX6 unwanted package guard
        run: |
          set -eo pipefail
          unwanted=(
            haproxy
            chinadns-ng
            dns2socks
            dns2tcp
            ipt2socks
            microsocks
            kmod-wireguard
            wireguard-tools
            luci-proto-wireguard
          )
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand AX6-IPQ/nss-extra.config; do
            for pkg in "${unwanted[@]}"; do
              if grep -qx "CONFIG_PACKAGE_${pkg}=y" "$cfg"; then
                echo "::error file=$cfg::unwanted or incomplete package selected: $pkg"
                exit 1
              fi
            done
          done

      - name: ZRAM config dependency check
        run: |
          set -eo pipefail
          required=(
            CONFIG_KERNEL_SWAP=y
            CONFIG_BUSYBOX_CONFIG_MKSWAP=y
            CONFIG_BUSYBOX_CONFIG_SWAPON=y
            CONFIG_BUSYBOX_CONFIG_FEATURE_SWAPON_DISCARD=y
            CONFIG_BUSYBOX_CONFIG_FEATURE_SWAPON_PRI=y
            CONFIG_BUSYBOX_CONFIG_SWAPOFF=y
            CONFIG_PACKAGE_kmod-zram=y
            CONFIG_KERNEL_ZRAM_BACKEND_ZSTD=y
            CONFIG_KERNEL_ZRAM_DEF_COMP_ZSTD=y
          )
          for cfg in AX6-IPQ/.config-stock AX6-IPQ/.config-expand; do
            grep -qx 'CONFIG_PACKAGE_zram-swap=y' "$cfg" || continue
            for symbol in "${required[@]}"; do
              grep -qx "$symbol" "$cfg" || {
                echo "::error file=$cfg::zram-swap requires $symbol"
                exit 1
              }
            done
          done
          grep -Fq "'etc/rc\\.d/S15zram'" .github/workflows/build-AX6-NSS.yml
          grep -Fq "'etc/rc\\.d/S15zram'" .github/workflows/build-AX6-IPQ.yml
          zram_defaults=AX6-IPQ/files/etc/uci-defaults/95-ax6-zram-defaults
          grep -Fq "zram_size_mb='256'" "$zram_defaults"
          grep -Fq "zram_comp_algo='zstd'" "$zram_defaults"
          grep -Fq 'system.@system[0].zram_size_mb' AX6-IPQ/files/sbin/nss-check
          grep -Fq 'system.@system[0].zram_comp_algo' AX6-IPQ/files/sbin/nss-check

      - name: ECM offload policy check
        run: |
          set -eo pipefail
          tune=AX6-IPQ/files/etc/uci-defaults/98-nss-tune
          health=AX6-IPQ/files/sbin/nss-check
          boot_guard=AX6-IPQ/files/etc/init.d/ax6-boot-guard
          br_hotplug=AX6-IPQ/files/etc/hotplug.d/net/100-disable_offloads_br_lan
          test -x "$tune"
          test -x "$health"
          test -x "$br_hotplug"
          grep -Fq "ecm.general.disable_offloads='1'" "$tune"
          grep -Fq "ecm.general.disable_gro_list='1'" "$tune"
          grep -Fq "ecm.general.offload_host_ifaces='br-lan'" "$tune"
          grep -Fq "ecm.general.offload_physical_policy='report'" "$tune"
          grep -Fq 'offload_host_ifaces:br-lan' "$boot_guard"
