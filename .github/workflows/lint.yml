      - name: Scenario policy ownership check
        run: |
          set -eo pipefail
          audit=AX6-IPQ/files/sbin/ax6-config-audit
          vlan=AX6-IPQ/files/sbin/vlan-add
          zt_fw4=AX6-IPQ/files/usr/bin/zerotier-fw4
          zt_reconcile=AX6-IPQ/files/usr/sbin/ax6-zerotier-reconcile
          zt_bypass=AX6-IPQ/files/usr/bin/ax6-openclash-zerotier-bypass
          zt_init=AX6-IPQ/files/etc/init.d/ax6-zerotier-reconcile
          openclash_contract=AX6-IPQ/scripts/check-openclash-runtime-contract.sh
          openclash_core_guard=.github/scripts/inject-openclash-rom-core-guard.sh
          test -x "$audit"
          test -x "$vlan"
          test -x "$zt_fw4"
          test -x "$zt_reconcile"
          test -x "$zt_bypass"
          test -x "$zt_init"
          test -x "$openclash_contract"
          test -x "$openclash_core_guard"
          if grep -Eq 'uci[[:space:]].*(set|delete|del|commit)|/etc/init\.d/.*(restart|reload)' "$audit"; then
            echo "::error file=$audit::scenario audit must remain read-only"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match the audit helper's literal UCI expression.
          for required in \
            'ZT_FW_PATH="${ZT_FW_PATH:-/var/run/zerotier-one/_fw4}"' \
            '"$ZT_FW_PATH/input.nft"' \
            '"$ZT_FW_PATH/forward.nft"' \
            '"$ZT_FW_PATH/srcnat.nft"' \
            'firewall.${_zt_section}.position' \
            '[ -r "$_zt_expected_path" ]' \
            'zerotier_input_ports_match' \
            'zerotier_owned_input_absent' \
            'nft input include exactly matches daemon ports and protocols' \
            'live nft input rules exactly match daemon ports and protocols' \
            'openclash_zerotier_bypass_match' \
            'openclash_zerotier_bypass_absent' \
            'service-port input permission disabled but stale service-port rules remain' \
            'stale ZeroTier self-proxy bypass rules remain' \
            'router self proxy intercepts ZeroTier without a matching dynamic bypass' \
            'all servers are disabled but WAN 1194 ACCEPT rule(s) remain active' \
            'internet_access=1 exposes TCP/1688' \
            'upstream uses auto_activate' \
            'vlan_filtering=1 conflicts with qosmio NSS WiFi offload guidance' \
            'config bridge-vlan is present' \
            'openclash_dns_redirect' \
            'OpenClash DNS Hijack' \
            'GeoIP/GeoSite/ASN/CHNR data use' \
            'enabled on ${oc_overlay_total} KiB overlay can refill flash' \
            'dashboard UI files occupy' \
            'fake-ip cache persistence enabled' \
            'custom DNS nameserver group is configured' \
            'default DNS is IPv4-only with disable_ipv6=1' \
            'subscription DNS owns nameserver/default-nameserver'; do
            grep -Fq "$required" "$audit" || {
              echo "::error file=$audit::scenario audit is missing runtime check: $required"
              exit 1
            }
          done
          # shellcheck disable=SC2016 # Match the audit helper's literal policy line.
          grep -Fq 'warn "OpenClash: ${oc_auto_geodata} enabled on ${oc_overlay_total} KiB overlay can refill flash"' "$audit" || {
            echo "::error file=$audit::small-overlay Geo auto-update policy must remain a warning"
            exit 1
          }
          # shellcheck disable=SC2016 # Reject the former literal failure policy line.
          if grep -Fq 'fail "OpenClash: ${oc_auto_geodata} enabled on ${oc_overlay_total} KiB overlay can refill flash"' "$audit"; then
            echo "::error file=$audit::small-overlay Geo auto-update policy must not be a failure"
            exit 1
          fi
          if grep -RqE \
            'upnpd\.config\.enabled=|zerotier\..*fw_allow_|openclash\.config\.|wireless\..*isolate=|=bridge-vlan|vlan_filtering' \
            AX6-IPQ/files/etc/init.d AX6-IPQ/files/etc/uci-defaults; then
            echo "::error::boot/default scripts must not force scenario-dependent service policy"
            exit 1
          fi
          grep -Fq "grep -q '=bridge-vlan'" "$vlan"
          grep -Fq 'RECONCILER=' "$zt_fw4"
          # shellcheck disable=SC2016 # Match literal helper variables.
          grep -Fq 'exec "$RECONCILER" --once' "$zt_fw4"
          grep -Fq 'read_stable_settings' "$zt_reconcile"
          grep -Fq 'STABLE_DELAY=' "$zt_reconcile"
          # shellcheck disable=SC2016 # Match literal helper variables.
          grep -Fq 'lock "$LOCK_FILE"' "$zt_reconcile"
          # shellcheck disable=SC2016 # Match literal helper variables.
          grep -Fq 'nft -c -f "$TRANSACTION"' "$zt_reconcile"
          grep -Fq 'AX6 ZeroTier UDP self bypass' "$zt_bypass"
          # shellcheck disable=SC2016 # Match the literal generated nft rule.
          grep -Fq 'meta l4proto { tcp, udp } th sport $primary' "$zt_bypass"
          if grep -Eq 'fw4[[:space:]]+reload|/etc/init\.d/(firewall|openclash|zerotier)[[:space:]]+(reload|restart)' \
              "$zt_fw4" "$zt_reconcile" "$zt_bypass"; then
            echo "::error::ZeroTier reconciliation must not reload firewall, OpenClash, or ZeroTier"
            exit 1
          fi
          grep -Fqx 'START=91' "$zt_init"
          # shellcheck disable=SC2016 # Match literal procd variables.
          grep -Fq 'procd_set_param command "$PROG" --daemon' "$zt_init"
          test -x .github/scripts/inject-openclash-zerotier-hook.sh
          grep -Fq 'openclash_mangle_output_v6' "$zt_bypass"
          grep -Fq 'inject-openclash-zerotier-hook.sh' AX6-IPQ/diy.sh
          grep -Fq 'inject-openclash-rom-core-guard.sh" apply' AX6-IPQ/diy.sh
          grep -Fq 'check-openclash-runtime-contract.sh' AX6-IPQ/diy.sh
          grep -Fq 'unconditional start_run_core chown' "$openclash_contract"
          grep -Fq 'disabled-mode residual redirect cleanup' "$openclash_contract"
          grep -Fq 'fw4 DNS hijack family check' "$openclash_contract"
          grep -Fq 'S91ax6-zerotier-reconcile' AX6-IPQ/diy.sh
          for workflow in .github/workflows/build-AX6-NSS.yml .github/workflows/build-AX6-IPQ.yml; do
            grep -Fq "'usr/bin/zerotier-fw4'" "$workflow"
            grep -Fq "'usr/sbin/ax6-zerotier-reconcile'" "$workflow"
            grep -Fq "'etc/init\\.d/ax6-zerotier-reconcile'" "$workflow"
            # shellcheck disable=SC2016 # Match the rootfs gate's literal runtime variable.
            grep -Fq 'nft -c -f "$TRANSACTION"' "$workflow"
            grep -Fq 'inject-openclash-rom-core-guard.sh check' "$workflow"
            grep -Fq 'check-openclash-runtime-contract.sh' "$workflow"
          done
          # shellcheck disable=SC2016 # Match vlan-add literal awk field reference.
          grep -Fq '/=zone$/{print $2}' "$vlan"
          grep -Fq "firewall zone named" "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.$NAME=zone' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.$NAME.input=REJECT' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.${NAME}_wan=forwarding' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.${NAME}_dns=rule' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set firewall.${NAME}_dhcp=rule' "$vlan"
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          grep -Fq 'set dhcp.$NAME=dhcp' "$vlan"
          # shellcheck disable=SC2016 # Match the literal transaction guard.
          grep -Fq 'uci -q changes "$package"' "$vlan"
          grep -Fq 'configuration failed; network, firewall and DHCP files were restored' "$vlan"
          # shellcheck disable=SC2016 # Reject an unsafe literal UCI template.
          if grep -Fq 'set firewall.$NAME.input=ACCEPT' "$vlan"; then
            echo "::error file=$vlan::new untrusted VLANs must not expose router services by default"
            exit 1
          fi
          # shellcheck disable=SC2016 # Match vlan-add literal UCI templates.
          if grep -Eq 'set network\.br_\$NAME\.vlan_filtering=' "$vlan"; then
            echo "::error file=$vlan::802.1q helper must not generate bridge VLAN filtering fields"
            exit 1
          fi

      - name: Router maintenance script safety check
        run: |
          set -eo pipefail
          backup="backup-router-config.sh"
          deploy="deploy-openclash-runtime.sh"
          preflight="preflight-router-restore.sh"
          test -x "$backup"
          test -x "$deploy"
          test -x "$preflight"
          grep -Fq 'FORENSIC-CONFIG-SNAPSHOT.tar.gz.blocked' "$backup"
          grep -Fq 'DO-NOT-RESTORE-WHOLE-BACKUP.txt' "$backup"
          grep -Fq 'Never upload FORENSIC-CONFIG-SNAPSHOT.tar.gz.blocked in LuCI.' "$backup"
          grep -Fq 'never pass it to sysupgrade -r' "$backup"
          grep -Fq 'legacy whole-restore archive found' "$preflight"
          if grep -Fq 'sysupgrade-config-restore-safe.tar.gz' "$backup"; then
            echo "::error file=$backup::a forensic snapshot must not look directly restorable"
            exit 1
          fi
          grep -Fq '/etc/shadow' "$backup"
          grep -Fq '/etc/shadow-' "$backup"
          grep -Fq 'generated OpenClash data leaked into archive' "$backup"
          grep -Fq 'forensic configuration snapshot contains links or special files' "$backup"
          grep -Fq 'ssh-authorized-keys.tar.gz' "$backup" "$preflight"
          grep -Fq 'zerotier-identity.tar.gz' "$backup" "$preflight"
          grep -Fq 'openclash-runtime.tar.gz' "$backup"
          grep -Fq 'openclash-runtime.tar.gz' "$deploy"
          grep -Fq '/etc/openclash/overwrite' "$backup"
          grep -Fq '/etc/openclash/overwrite' "$deploy"
          grep -Fq 'OpenClash archive contains paths outside the restore allowlist' "$deploy"
          grep -Fq 'OpenClash archive contains links or special files' "$deploy"
          grep -Fq 'rollback_on_error' "$deploy"
          grep -Fq 'previous OpenClash state restored' "$deploy"
          grep -Fq '    rm -rf' "$deploy"
          grep -Fq 'OpenClash core: disabled by restored configuration' "$deploy"
          grep -Fq 'OpenClash core, DNS and firewall contract: ready' "$deploy"
          grep -Fq '/sbin/ax6-config-audit -q' "$deploy"
          grep -Fq '/sbin/ax6-config-audit -v' "$deploy"
          grep -Fq 'StrictHostKeyChecking=yes' "$backup" "$deploy"
          # shellcheck disable=SC2016 # Match the literal known_hosts option in both scripts.
          grep -Fq 'UserKnownHostsFile="$SSH_KNOWN_HOSTS"' "$backup" "$deploy"
          if grep -Fq 'ax6-config-audit -v || true' "$deploy"; then
            echo "::error file=$deploy::restore must not ignore final configuration audit failures"
            exit 1
          fi
          grep -Fq 'The complete sysupgrade archive was not restored automatically.' "$deploy"
          grep -Fq 'redundant OpenClash core already exists in overlay' "$deploy"
          grep -Fq 'overlay contains a redundant' AX6-IPQ/files/sbin/ax6-config-audit
          grep -Fq 'legacy sysupgrade policy keeps core/Geo/cache' AX6-IPQ/files/sbin/ax6-config-audit
          grep -Fq 'ax6-backup-*/' .gitignore
          if grep -Fq '        /etc/openclash/proxy_provider' "$backup" "$deploy" ||
             grep -Fq '        /etc/openclash/rule_provider' "$backup" "$deploy" ||
             grep -Fq '        /usr/share/openclash/fix_dot.sh' "$backup" "$deploy"; then
            echo "::error::OpenClash restore scope must exclude generated providers and package scripts"
            exit 1
          fi
          if grep -Eq 'el1si7d_doggygosubs|head -[0-9]+ /etc/openclash/config' "$backup" "$deploy"; then
            echo "::error::router maintenance scripts must not hard-code a subscription filename or truncate backups"
            exit 1
          fi
          grep -Fq 'blacklist nf_flow_table' AX6-IPQ/files/etc/modprobe.d/nss-no-flow.conf

      - name: Build dependency installation policy check
        run: |
          set -eo pipefail
          for workflow in \
            .github/workflows/build-AX6-IPQ.yml \
            .github/workflows/build-AX6-NSS.yml \
            .github/workflows/build-IMM.yml \
            .github/workflows/build-LEDE.yml; do
            grep -Fq -- '--no-install-recommends' "$workflow"
            grep -Fq 'Acquire::Retries=3' "$workflow"
            grep -Fq 'TZ: Asia/Shanghai' "$workflow"
            if grep -Fq 'timedatectl' "$workflow"; then
              echo "::error file=$workflow::use the workflow TZ environment; hosted runners may reject system timezone changes"
              exit 1
            fi
            if grep -Eq 'apt-get .*autoremove' "$workflow"; then
              echo "::error file=$workflow::do not autoremove runner packages after installing build dependencies"
              exit 1
            fi
          done
          grep -Fq 'large-packages: false' .github/workflows/build-AX6-NSS.yml

      - name: IRQ policy ownership check
        run: |
          set -eo pipefail
          health=AX6-IPQ/files/sbin/nss-check
          for required in \
            S26qca-nss-ecm \
            S19qca-nss-pbuf \
            S28qca-nss-drv \
            S29qca-nss-netlink \
            S93smp_affinity \
            S99set-irq-affinity; do
            grep -Fq "$required" "$health" || {
              echo "::error file=$health::runtime health check is missing startup link $required"
              exit 1
            }
          done
          if [ -e AX6-IPQ/files/etc/init.d/ax6-irq-affinity ] || \
             grep -R -n -E \
               'S[0-9]+ax6-irq-affinity|ax6-irq-affinity (apply|reload|restart)' \
               AX6-IPQ/diy.sh AX6-IPQ/files/etc/hotplug.d AX6-IPQ/files/etc/rc.d 2>/dev/null; then
            echo "::error::custom AX6 IRQ policy must remain manual and must not override upstream"
            exit 1
          fi
          if [ -e AX6-IPQ/files/etc/init.d/set-irq-affinity ]; then
            echo "::error::AX6 overlay must not replace the locked qualcommax set-irq-affinity policy"
            exit 1
          fi
          for required in \
            'Linux RPS/RFS/XPS active' \
            'rps_sock_flow_entries' \
            'rps_flow_cnt' \
            '@.network[*].ports[*]' \
            'xps_cpus'; do
            grep -Fq "$required" "$health" || {
              echo "::error file=$health::runtime health check is missing Linux RPS/RFS gate: $required"
              exit 1
            }
          done
          test -x AX6-IPQ/files/usr/sbin/ax6-irq-affinity

      - name: NSS pbuf runtime application check
        run: |
          set -eo pipefail
          diy=AX6-IPQ/diy.sh
          health=AX6-IPQ/files/sbin/nss-check
          classifier=AX6-IPQ/files/usr/libexec/ax6-nss-pbuf-classify
          test -x "$classifier"
          sh -n "$classifier" "$health" tests/test-pbuf-fixture.sh
          NSS_PBUF_CLASSIFIER="$classifier" sh tests/test-pbuf-fixture.sh
          if grep -Eq 'ath11k_sysfs_device_available|wait_for_ath11k_nss_offload|wait_for_nss_sysctls|qca-nss-pbuf.init: n2h sysctl order mismatch' "$diy"; then
            echo "::error file=$diy::qca-nss-pbuf must be fixed in SOURCE_COMMIT, not patched in diy.sh"
            exit 1
          fi
          for required in \
            'NSS pbuf/N2H profile applied' \
            'NSS EDMA alloc-fail growth is stable' \
            ax6-nss-pbuf-classify \
            edma_err_alloc_fail_cnt \
            n2h_wifi_pool_buf; do
            grep -Fq "$required" "$health" || {
              echo "::error file=$health::runtime health check is missing $required"
              exit 1
            }
          done

      - name: NSS .config conflict check (merged with nss-extra)
        run: |
          set -eo pipefail
          python3 - <<'PY'
          """模拟 workflow 的 `cat nss-extra.config >> .config` 后,
          检查 NSS 互斥包是否同时启用,并提示缺失的推荐包。
          """
          import glob
          import os
          import re
          import sys

          # NSS 互斥对:同一行同时 =y 即报错
          NSS_CONFLICT = (
              ('kmod-qca-nss-drv', 'kmod-nf-flow'),
              ('kmod-qca-nss-drv', 'kmod-ipt-offload'),
              ('kmod-qca-nss-drv', 'kmod-nft-offload'),
              ('kmod-qca-nss-drv', 'kmod-fast-classifier'),
              ('kmod-qca-nss-drv', 'kmod-shortcut-fe'),
              ('kmod-qca-nss-drv', 'kmod-shortcut-fe-cm'),
          )
          # 推荐启用的包。ATH11K_NSS_SUPPORT 不是 PACKAGE_ 符号，由前面的
          # locked-source/config checks 单独验证。
          NSS_RECOMMENDED_PACKAGES = (
              'kmod-qca-ssdk',
          )
          NSS_EXTRA = 'AX6-IPQ/nss-extra.config'

          PAT_Y = re.compile(r'^CONFIG_(PACKAGE_[\w-]+)=([ymn])$')
          PAT_N = re.compile(r'^# CONFIG_(PACKAGE_[\w-]+) is not set$')


          def parse_config(path):
              """读取 OpenWrt .config,返回 {symbol: 'y'|'n'} 字典。"""
              result = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      m = PAT_Y.match(line)
                      if m:
                          result[m.group(1)] = m.group(2)
                          continue
                      m = PAT_N.match(line)
                      if m:
                          result[m.group(1)] = 'n'
              return result


          def main():
              extra = parse_config(NSS_EXTRA) if os.path.exists(NSS_EXTRA) else {}
              fail_count = 0

              for cfg in sorted(glob.glob('AX6-IPQ/.config*')):
                  if cfg == NSS_EXTRA:
                      continue
                  merged = parse_config(cfg)
                  # 模拟 workflow `cat nss-extra.config >> .config`(后写覆盖)
                  merged.update(extra)

                  if merged.get('PACKAGE_kmod-qca-nss-drv') != 'y':
                      print(f'::notice file={cfg}::no NSS, skip')
                      continue

                  for a, b in NSS_CONFLICT:
                      if merged.get(f'PACKAGE_{a}') == 'y' and merged.get(f'PACKAGE_{b}') == 'y':
                          print(
                              f'::error file={cfg}::CONFLICT (after nss-extra merge) '
                              f'PACKAGE_{a}=y AND PACKAGE_{b}=y'
                          )
                          fail_count += 1

                  for need in NSS_RECOMMENDED_PACKAGES:
                      if merged.get(f'PACKAGE_{need}') != 'y':
                          print(
                              f'::warning file={cfg}::missing recommended '
                              f'PACKAGE_{need}=y'
                          )

              return 1 if fail_count else 0


          sys.exit(main())
          PY
