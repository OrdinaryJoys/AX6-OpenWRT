# yamllint disable rule:line-length
name: Build OpenWRT for AX6-IPQ

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x.git
  REPO_BRANCH: main-nss
  CONFIG_FILE: AX6-IPQ/.config-stock
  EXTRA_CONFIG: AX6-IPQ/nss-extra.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Free disk space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c  # v10
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eo pipefail
          # shellcheck disable=SC2086,SC2128
          mapfile -t PKGS < <(grep -v '^\s*#' .github/depends-ubuntu-2204.txt | grep -v '^\s*$')
          sudo -E apt-get -qq -o Acquire::Retries=3 update
          sudo -E apt-get -qq -o Acquire::Retries=3 install -y --no-install-recommends "${PKGS[@]}"
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo chown -R "$USER":"$(id -gn)" "$GITHUB_WORKSPACE"

      - name: Clone source code
        run: |
          set -eo pipefail
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          echo "IPQ_SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Load locked external packages
        run: |
          set -eo pipefail
          set -a
          . .github/ax6-nss-lock.env
          set +a
          for name in \
            ARGON_THEME_URL ARGON_THEME_COMMIT \
            ARGON_CONFIG_URL ARGON_CONFIG_COMMIT \
            OPENCLASH_URL OPENCLASH_REF; do
            value="${!name:-}"
            [ -n "$value" ] || {
              echo "::error::$name is missing from .github/ax6-nss-lock.env"
              exit 1
            }
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          for name in ARGON_THEME_COMMIT ARGON_CONFIG_COMMIT; do
            value="${!name}"
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::$name must be a full 40-character lowercase commit SHA"
              exit 1
            }
          done

      - name: Update & install feeds
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config and apply DIY
        run: |
          set -eo pipefail
          rm -rf openwrt/files
          [ -e "$FILES" ] && cp -r "$FILES" openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          if [ -e "$EXTRA_CONFIG" ]; then
            cat "$EXTRA_CONFIG" >> openwrt/.config
          fi
          chmod +x "$DIY_SH"
          ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_SH" )

      - name: Download package
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          make defconfig
          # 防御:defconfig 可能重新启用 CONFIG_KERNEL_WERROR,
          # 导致 -Wmissing-prototypes 变成硬错误使外部模块编译失败。
          sed -i 's/^CONFIG_KERNEL_WERROR=y$/# CONFIG_KERNEL_WERROR is not set/' .config
          # NSS 冲突防护:若 nss-extra.config 已追加 NSS 驱动,则检查互斥包
          # (LiBwrt/openwrt-6.x 不含 NSS 驱动时可安全跳过)
          if grep -q '^CONFIG_PACKAGE_kmod-qca-nss-drv=y' .config; then
            echo "[IPQ] NSS driver detected — enforcing conflict blacklist"
            NSS_CONFLICTS="kmod-nf-flow kmod-ipt-offload kmod-nft-offload kmod-fast-classifier kmod-shortcut-fe kmod-shortcut-fe-cm"
            for pkg in $NSS_CONFLICTS; do
              sed -i "s|^CONFIG_PACKAGE_${pkg}=y$|# CONFIG_PACKAGE_${pkg} is not set|" .config
            done
            # 验证冲突包已清除
            for pkg in $NSS_CONFLICTS; do
              if grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
                echo "::error::NSS conflict: CONFIG_PACKAGE_${pkg}=y still enabled after sed"
                exit 2
              fi
            done
            # 当前源树仍定义且 FW 12.5 不支持的选项强制 =n。
            sed -i \
              's|^CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y$|# CONFIG_NSS_DRV_WIFI_MESH_ENABLE is not set|' \
              .config
            # 验证 NSS_DRV 不支持项已清除
            if grep -q '^CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y$' .config; then
              echo "::error::NSS FW 12.5 unsupported: CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y still enabled after sed"
              exit 2
            fi
          fi
          # kmod-nf-ipt: 确保 IP_NF_IPTABLES=m (kernel 6.18 默认关闭 LEGACY 框架)
          # 缺失会导致 kmod-nf-ipt 空包 → firewall4 启动失败
          for sym in CONFIG_IP_NF_IPTABLES CONFIG_IP6_NF_IPTABLES CONFIG_NETFILTER_XTABLES; do
            if ! grep -q "^${sym}=[ym]" .config; then
              echo "${sym}=m" >> .config
            fi
          done
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          echo "$(nproc) thread compile"
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Validate final rootfs contents
        run: |
          set -eo pipefail
          mapfile -d '' images < <(
            find openwrt/bin/targets -type f -name '*-squashfs-sysupgrade.bin' -print0
          )
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one squashfs sysupgrade image, found ${#images[@]}"
            exit 1
          fi
          mkdir -p image-verify
          tar -xf "${images[0]}" -C image-verify
          rootfs="$(find image-verify -type f -name root -print -quit)"
          [ -n "$rootfs" ] || {
            echo "::error::Sysupgrade image does not contain a root filesystem"
            exit 1
          }
          unsquashfs -ll "$rootfs" > image-verify/rootfs-files.txt
          for required in \
            'lib/modules/.*/qca-ssdk\.ko' \
            'lib/modules/.*/qca-nss-dp\.ko' \
            'lib/modules/.*/qca-nss-drv\.ko' \
            'lib/modules/.*/qca-nss-netlink\.ko' \
            'lib/modules/.*/qca-nss-qdisc\.ko' \
            'lib/modules/.*/ecm\.ko' \
            'lib/modules/.*/act_nssmirred\.ko' \
            'lib/modules/.*/zram\.ko' \
            'etc/config/ecm' \
            'etc/config/nss' \
            'etc/config/pbuf' \
            'etc/init\.d/qca-nss-ecm' \
            'etc/init\.d/qca-nss-drv' \
            'etc/init\.d/qca-nss-netlink' \
            'etc/init\.d/qca-nss-pbuf' \
            'etc/init\.d/set-irq-affinity' \
            'etc/init\.d/smp_affinity' \
            'etc/init\.d/zram' \
            'etc/modprobe\.d/nss-no-flow\.conf' \
            'etc/uci-defaults/94-ax6-zerotier-zone' \
            'etc/uci-defaults/95-ax6-zram-defaults' \
            'etc/uci-defaults/98-nss-tune' \
            'etc/uci-defaults/15_smp_affinity\.sh' \
            'etc/hotplug\.d/net/99-disable_offloads' \
            'etc/hotplug\.d/net/100-disable_offloads_br_lan' \
            'lib/netifd/offload/disable_offloads\.sh' \
            'usr/lib/sqm/nss-zk\.qos' \
            'usr/bin/zerotier-fw4' \
            'sbin/nss-check' \
            'sbin/ax6-config-audit' \
            'etc/init\.d/ax6-wifi-regdom' \
            'usr/sbin/ax6-irq-affinity'; do
            grep -Eq "squashfs-root/${required}( ->|$)" image-verify/rootfs-files.txt || {
              echo "::error::Final rootfs is missing required path: $required"
              exit 1
            }
          done
          unsquashfs -cat "$rootfs" etc/uci-defaults/94-ax6-zerotier-zone \
            > image-verify/94-ax6-zerotier-zone
          for required in \
            "firewall.zerotier_input.path='/var/run/zerotier-one/_fw4/input.nft'" \
            "firewall.zerotier_forward.path='/var/run/zerotier-one/_fw4/forward.nft'" \
            "firewall.zerotier_srcnat.path='/var/run/zerotier-one/_fw4/srcnat.nft'" \
            "firewall.zerotier_srcnat.chain='srcnat'" \
            "set firewall.@zone[-1].masq='0'" \
            'ZT_ZONE_SECTION}.masq=0'; do
            grep -Fq "$required" image-verify/94-ax6-zerotier-zone || {
              echo "::error::Final rootfs ZeroTier fw4 registration is missing: $required"
              exit 1
            }
          done
          if grep -Fq "set firewall.@zone[-1].masq='1'" image-verify/94-ax6-zerotier-zone; then
            echo "::error::Final rootfs ZeroTier zone enables implicit masquerade"
            exit 1
          fi
          if grep -Eq \
            'squashfs-root/etc/(init\.d/ax6-irq-affinity|rc\.d/[SK][0-9]+ax6-irq-affinity)( ->|$)' \
            image-verify/rootfs-files.txt; then
            echo "::error::Final rootfs auto-enables the manual AX6 IRQ override"
            exit 1
          fi
          for enabled in \
            'etc/rc\.d/S10ax6-wifi-regdom' \
            'etc/rc\.d/S12ax6-boot-guard' \
            'etc/rc\.d/S15zram' \
            'etc/rc\.d/S26qca-nss-ecm' \
            'etc/rc\.d/S19qca-nss-pbuf' \
            'etc/rc\.d/S28qca-nss-drv' \
            'etc/rc\.d/S29qca-nss-netlink' \
            'etc/rc\.d/S93smp_affinity' \
            'etc/rc\.d/S99set-irq-affinity'; do
            grep -Eq "squashfs-root/${enabled}( ->|$)" image-verify/rootfs-files.txt || {
              echo "::error::Final rootfs is missing required startup link: $enabled"
              exit 1
            }
          done
          unsquashfs -cat "$rootfs" etc/modprobe.d/ath11k.conf \
            > image-verify/ath11k.conf
          grep -Fqx 'options ath11k frame_mode=2' image-verify/ath11k.conf
          grep -Fqx 'options ath11k nss_offload=1' image-verify/ath11k.conf
          if grep -Eq '^[[:space:]]*options[[:space:]]+ath11k[[:space:]].*rx_hash=' \
            image-verify/ath11k.conf; then
            echo "::error::Final rootfs contains unsupported ath11k rx_hash parameter"
            exit 1
          fi
          unsquashfs -cat "$rootfs" etc/init.d/qca-nss-pbuf \
            > image-verify/qca-nss-pbuf.init
          grep -Fqx 'START=19' image-verify/qca-nss-pbuf.init
          for required in \
            ath11k_sysfs_device_available \
            wait_for_ath11k_nss_offload \
            wait_for_nss_sysctls \
            'confirming dev.nss.n2hcfg.n2h_high_water_core0'; do
            grep -Fq "$required" image-verify/qca-nss-pbuf.init || {
              echo "::error::Final rootfs qca-nss-pbuf is missing source fix: $required"
              exit 1
            }
          done
          echo "Final rootfs validation: PASS"

      - name: Stage release artifacts
        run: |
          set -eo pipefail
          mkdir -p upload
          find openwrt/bin/targets -type f \( -name '*.ubi' -o -name '*.bin' -o -name '*.itb' \) -exec cp {} upload/ \;
          # 附带 build info / checksums / read-only audit tools
          find openwrt/bin/targets -type f \( -name 'config.buildinfo' -o -name 'feeds.buildinfo' -o -name 'version.buildinfo' \) -exec cp {} upload/ \; 2>/dev/null || true
          [ -f AX6-IPQ/files/sbin/nss-check ] && cp AX6-IPQ/files/sbin/nss-check upload/nss-check.sh
          [ -f AX6-IPQ/files/sbin/ax6-config-audit ] && cp AX6-IPQ/files/sbin/ax6-config-audit upload/ax6-config-audit.sh
          {
            echo "SOURCE_REPO=$REPO_URL"
            echo "SOURCE_BRANCH=$REPO_BRANCH"
            echo "SOURCE_COMMIT=$IPQ_SOURCE_COMMIT"
            echo "ARGON_THEME_URL=$ARGON_THEME_URL"
            echo "ARGON_THEME_COMMIT=$ARGON_THEME_COMMIT"
            echo "ARGON_CONFIG_URL=$ARGON_CONFIG_URL"
            echo "ARGON_CONFIG_COMMIT=$ARGON_CONFIG_COMMIT"
            echo "OPENCLASH_URL=$OPENCLASH_URL"
            echo "OPENCLASH_REF=$OPENCLASH_REF"
          } > upload/BUILD-PROVENANCE-AX6-IPQ.txt
          ( cd upload && sha256sum -- * 2>/dev/null > SHA256SUMS ) || true
          ls -lh upload/

      - name: Upload unvalidated backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AX6_IPQ_UNVALIDATED_${{ github.sha }}
          path: upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
