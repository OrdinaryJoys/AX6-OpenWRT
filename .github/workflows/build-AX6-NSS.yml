# yamllint disable rule:line-length
name: Build OpenWRT for AX6-NSS

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Hardware variant (must match physical NAND!)'
        required: true
        type: choice
        default: 'stock'
        options:
          - stock     # 1GB RAM + 128MB NAND — custom U-Boot/SMEM merged rootfs=0x06640000
          - expand    # 1GB RAM + 256MB NAND (HW-modded only) — DANGER if NAND <256MB
      ssh:
        description: 'SSH debug connection'
        required: false
        type: boolean
        default: false

env:
  BUILD_LOCK: .github/ax6-nss-lock.env
  EXTRA_CONFIG: AX6-IPQ/nss-extra.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai
  # NSS 互斥包黑名单 — 三处 (pre-flight Python / sed / post-defconfig Python) 共用
  # 必须空格分隔以便 shell for-loop 与 Python split() 同时可用
  NSS_BLACKLIST: >-
    kmod-nf-flow
    kmod-ipt-offload
    kmod-nft-offload
    kmod-fast-classifier
    kmod-shortcut-fe
    kmod-shortcut-fe-cm

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # Keep preinstalled Clang/LLVM: they are explicit OpenWrt dependencies.
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set variant config + brick-safety pre-flight
        id: variant
        env:
          VARIANT_INPUT: ${{ github.event.inputs.variant }}
        run: |
          set -eo pipefail
          case "$VARIANT_INPUT" in
            stock)
              CFG="AX6-IPQ/.config-stock"; TAG="STOCK"
              echo "::notice::Building STOCK profile for the 0x06640000 SMEM/custom U-Boot merged layout"
              ;;
            expand)
              CFG="AX6-IPQ/.config-expand"; TAG="EXPAND"
              echo "::warning::Building EXPAND variant — requires HW-modded NAND ≥256MB. DO NOT FLASH if NAND is 128MB!"
              ;;
            *)
              echo "::error::Unknown variant: $VARIANT_INPUT"; exit 1
              ;;
          esac
          # Export to subsequent steps via $GITHUB_ENV
          {
            echo "CONFIG_FILE=$CFG"
            echo "VARIANT_TAG=$TAG"
          } >> "$GITHUB_ENV"
          # Pre-flight check in this step: pass CFG via local env var (NOT $GITHUB_ENV
          # which only applies to subsequent steps)
          export _PREFLIGHT_CFG="$CFG"
          python3 - <<'PY'
          """Pre-flight 校验:在 feeds 拉取前检查 .config 与 NSS 冲突。"""
          import os
          import re
          import sys

          PAT_Y = re.compile(r'^CONFIG_(PACKAGE_[\w-]+)=([ymn])$')
          PAT_N = re.compile(r'^# CONFIG_(PACKAGE_[\w-]+) is not set$')

          def parse_config(path):
              """读取 OpenWrt .config,返回 {symbol: 'y'|'n'} 字典。"""
              result = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      m = PAT_Y.match(line)
                      if m:
                          result[m.group(1)] = m.group(2)
                          continue
                      m = PAT_N.match(line)
                      if m:
                          result[m.group(1)] = 'n'
              return result


          def main():
              cfg_path = os.environ['_PREFLIGHT_CFG']
              extra_path = 'AX6-IPQ/nss-extra.config'
              # 与 env.NSS_BLACKLIST 共用同一份真正互斥的 flow-offload 黑名单。
              blacklist = os.environ['NSS_BLACKLIST'].split()

              merged = parse_config(cfg_path)
              merged.update(parse_config(extra_path))

              if merged.get('PACKAGE_kmod-qca-nss-drv') != 'y':
                  print(f'Pre-flight skip (no NSS) for {cfg_path}')
                  return 0

              for pkg in blacklist:
                  if merged.get(f'PACKAGE_{pkg}') == 'y':
                      print(
                          f'::error::NSS conflict: PACKAGE_{pkg}=y '
                          f'collides with kmod-qca-nss-drv'
                      )
                      return 2

              print(f'Pre-flight PASS for {cfg_path}')
              return 0


          sys.exit(main())
          PY

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eo pipefail
          # 改用仓内固化的依赖清单(去除远程 curl|apt 注入风险)
          mapfile -t PKGS < <(grep -v '^\s*#' .github/depends-ubuntu-2204.txt | grep -v '^\s*$')
          sudo -E apt-get -qq -o Acquire::Retries=3 update
          sudo -E apt-get -qq -o Acquire::Retries=3 install -y --no-install-recommends "${PKGS[@]}"
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo chown -R "$USER":"$(id -gn)" "$GITHUB_WORKSPACE"

      - name: Load and verify build lock
        run: |
          set -eo pipefail
          set -a
          # shellcheck source=.github/ax6-nss-lock.env
          . "$BUILD_LOCK"
          set +a
          for name in \
            SOURCE_REPO SOURCE_TRACKING_BRANCH SOURCE_COMMIT \
            SQM_SCRIPTS_NSS_URL SQM_SCRIPTS_NSS_COMMIT \
            LUCI_FEED_URL LUCI_FEED_COMMIT \
            PACKAGES_FEED_URL PACKAGES_FEED_COMMIT \
            ROUTING_FEED_URL ROUTING_FEED_COMMIT \
            TELEPHONY_FEED_URL TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_URL VIDEO_FEED_COMMIT \
            ARGON_THEME_URL ARGON_THEME_COMMIT \
            ARGON_CONFIG_URL ARGON_CONFIG_COMMIT \
            OPENCLASH_URL OPENCLASH_REF; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is missing from $BUILD_LOCK"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          for name in \
            SOURCE_COMMIT SQM_SCRIPTS_NSS_COMMIT LUCI_FEED_COMMIT \
            PACKAGES_FEED_COMMIT ROUTING_FEED_COMMIT TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_COMMIT ARGON_THEME_COMMIT ARGON_CONFIG_COMMIT; do
            value="${!name}"
            if ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$name must be a full 40-character lowercase commit SHA"
              exit 1
            fi
          done

      - name: Clone locked source code
        run: |
          set -eo pipefail
          git init openwrt
          git -C openwrt remote add origin "$SOURCE_REPO"
          git -C openwrt fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          actual=$(git -C openwrt rev-parse HEAD)
          [ "$actual" = "$SOURCE_COMMIT" ] || {
            echo "::error::Source lock mismatch: expected $SOURCE_COMMIT, got $actual"
            exit 1
          }
          ath_mk="openwrt/package/kernel/mac80211/ath.mk"
          for dependency in \
            '+ATH11K_NSS_SUPPORT:kmod-qca-nss-drv' \
            '+ATH11K_NSS_MESH_SUPPORT:kmod-qca-nss-drv-wifi-meshmgr' \
            '+@(ATH11K_NSS_SUPPORT):NSS_DRV_WIFIOFFLOAD_ENABLE' \
            '+@(ATH11K_NSS_SUPPORT):NSS_DRV_WIFI_EXT_VDEV_ENABLE'; do
            grep -Fq "$dependency" "$ath_mk" || {
              echo "::error file=$ath_mk::missing ATH11K NSS dependency: $dependency"
              exit 1
            }
          done
          # shellcheck disable=SC2016 # Match literal Makefile config expression.
          grep -Fq 'config-$(CONFIG_ATH11K_NSS_MESH_SUPPORT) += ATH11K_NSS_MESH_SUPPORT' "$ath_mk" || {
            echo "::error file=$ath_mk::ATH11K_NSS_MESH_SUPPORT must be controlled by CONFIG_ATH11K_NSS_MESH_SUPPORT"
            exit 1
          }
          # shellcheck disable=SC2016 # Match literal Makefile config expression.
          grep -Fq 'config-$(CONFIG_ATH11K_NSS_SUPPORT) += ATH11K_NSS_SUPPORT' "$ath_mk" || {
            echo "::error file=$ath_mk::ATH11K_NSS_SUPPORT must not also enable mesh support"
            exit 1
          }
          # shellcheck disable=SC2016 # Match literal Makefile config expression.
          if grep -Eq 'config-\$\(CONFIG_ATH11K_NSS_SUPPORT\).*ATH11K_NSS_MESH_SUPPORT' "$ath_mk"; then
            echo "::error file=$ath_mk::ATH11K_NSS_SUPPORT must not force ATH11K_NSS_MESH_SUPPORT"
            exit 1
          fi
          platform_sh="openwrt/target/linux/qualcommax/ipq807x/base-files/lib/upgrade/platform.sh"
          grep -Fq 'xiaomi_stock_check_image_size' "$platform_sh" || {
            echo "::error file=$platform_sh::missing runtime MTD/image capacity preflight"
            exit 1
          }
          grep -Fq 'xiaomi_stock_get_upgrade_part' "$platform_sh" || {
            echo "::error file=$platform_sh::missing dynamic rootfs/rootfs_1 selection"
            exit 1
          }
          upgrade_test="openwrt/tests/qualcommax-xiaomi-stock-upgrade.sh"
          [ -x "$upgrade_test" ] || {
            echo "::error file=$upgrade_test::missing executable Xiaomi stock upgrade regression test"
            exit 1
          }
          "$upgrade_test"

      - name: Add NSS feed and prepare feeds
        run: |
          set -eo pipefail
          cd openwrt
          # Replace every moving feed with the commits in the build lock.
          cat > feeds.conf.default <<EOF
          src-git sqm_scripts_nss ${SQM_SCRIPTS_NSS_URL}^${SQM_SCRIPTS_NSS_COMMIT}
          src-git packages ${PACKAGES_FEED_URL}^${PACKAGES_FEED_COMMIT}
          src-git luci ${LUCI_FEED_URL}^${LUCI_FEED_COMMIT}
          src-git routing ${ROUTING_FEED_URL}^${ROUTING_FEED_COMMIT}
          src-git telephony ${TELEPHONY_FEED_URL}^${TELEPHONY_FEED_COMMIT}
          src-git video ${VIDEO_FEED_URL}^${VIDEO_FEED_COMMIT}
          EOF
          # 全量刷新
          ./scripts/feeds clean
          rm -rf tmp/
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # nss_ipv4_reasm 前置声明已由锁定 NSS feed 的
          # 0035-nss-drv-add-ipv4-reasm-prototypes.patch 提供,不再需要补丁 0040.
          # qca-mcs kernel 6.18 兼容补丁也已在 feed 0005-kernel-6.18.patch 中.

      - name: Load custom config and apply DIY
        run: |
          set -eo pipefail
          # 用 cp 而非 mv,本地反复跑也不破仓
          # 先删除目标避免 cp -r 嵌套:若 openwrt/files 已存在,
          # cp -r AX6-IPQ/files openwrt/files 会变成 openwrt/files/files/
          rm -rf openwrt/files
          [ -e "$FILES" ] && cp -r "$FILES" openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          # 关键修复:把 NSS 互斥/必需配置追加到 .config
          if [ -e "$EXTRA_CONFIG" ]; then
            cat "$EXTRA_CONFIG" >> openwrt/.config
          fi
          chmod +x "$DIY_SH"
          ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_SH" )

      - name: Verify tracked OpenClash inputs
        run: |
          set -eo pipefail
          metadata=openwrt/.openclash-build.env
          [ -s "$metadata" ] || {
            echo "::error file=$metadata::OpenClash build metadata is missing"
            exit 1
          }
          set -a
          # shellcheck source=/dev/null
          . "$metadata"
          set +a
          printf '%s\n' "$OPENCLASH_ACTUAL_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "$OPENCLASH_ACTUAL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$OPENCLASH_CORE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          for name in \
            OPENCLASH_ACTUAL_VERSION OPENCLASH_ACTUAL_COMMIT \
            OPENCLASH_CORE_URL OPENCLASH_CORE_SHA256; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - name: SSH debug (manual trigger)
        if: ${{ github.event.inputs.ssh == 'true' || github.event.inputs.ssh == true }}
        uses: P3TERX/ssh2actions@71006b93bff498b020448ac10964f8a5d0f9f32c  # v1.0.0
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download package
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          make defconfig 2>&1 | tee defconfig.log
          if grep -q 'recursive dependency detected' defconfig.log; then
            echo "::error::Kconfig recursive dependency detected"
            exit 1
          fi
          # defconfig 会重新启用 CONFIG_KERNEL_WERROR,导致 -Wmissing-prototypes 变成硬错误,
          # 进而导致 NSS 外部内核模块(qca-nss-drv/qca-mcs 等)编译失败。
          # 此处强制禁用以避免连锁问题。
          sed -i 's/^CONFIG_KERNEL_WERROR=y$/# CONFIG_KERNEL_WERROR is not set/' .config
          # 防御:确保 ip_tables.ko / ip6_tables.ko 内核选项启用
          # nss-fork b0c5bf38 已删除 kmod-nf-ipt 错误的 +!LINUX_6_12:kmod-iptables 依赖,
          # 这两行变成幂等防御(make defconfig 会通过 kmod-nf-ipt KCONFIG 自动处理),
          # 但保留以防止未来上游回归。
          grep -q 'CONFIG_IP_NF_IPTABLES=m' .config || echo 'CONFIG_IP_NF_IPTABLES=m' >> .config
          grep -q 'CONFIG_IP6_NF_IPTABLES=m' .config || echo 'CONFIG_IP6_NF_IPTABLES=m' >> .config
          grep -q 'CONFIG_NETFILTER_XTABLES=m' .config || echo 'CONFIG_NETFILTER_XTABLES=m' >> .config
          # defconfig 通过 firewall4→kmod-nft-offload→kmod-nf-flow 依赖链
          # 强制拉回 NSS 冲突包,此处 sed 强制覆盖为 =n
          # 黑名单来自 env.NSS_BLACKLIST(单一来源,与 pre-flight Python 共用)
          for pkg in $NSS_BLACKLIST; do
            sed -i "s|^CONFIG_PACKAGE_${pkg}=y$|# CONFIG_PACKAGE_${pkg} is not set|" .config
          done
          # 当前源树仍定义的 WIFI_MESH 需要 FW 11.4；本构建使用 FW 12.5。
          #   https://github.com/qosmio/openwrt-ipq#nss-support-matrix
          sed -i \
            's|^CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y$|# CONFIG_NSS_DRV_WIFI_MESH_ENABLE is not set|' \
            .config
          # 验证 NSS_DRV 不支持项已清除 (不包括 RMNET:🟨 qca-nss-netlink 依赖)
          if grep -q '^CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y$' .config; then
            echo "::error::NSS FW 12.5 unsupported: CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y still enabled after sed"
            exit 2
          fi
          # 验证:确保 NSS 冲突包不再出现
          python3 - <<'PY'
          """Post-defconfig 校验:sed 拉黑后再扫一遍 .config,确保没漏。"""
          import os
          import sys


          def main():
              blacklist = os.environ['NSS_BLACKLIST'].split()
              expected_off = {f'CONFIG_PACKAGE_{pkg}=y' for pkg in blacklist}
              has_nss = False
              found = []

              with open('.config') as fh:
                  for line in fh:
                      line = line.strip()
                      if line == 'CONFIG_PACKAGE_kmod-qca-nss-drv=y':
                          has_nss = True
                      if line in expected_off:
                          # 形如 CONFIG_PACKAGE_kmod-nf-flow=y → 报告 kmod-nf-flow
                          found.append(line.split('=', 1)[0].removeprefix('CONFIG_PACKAGE_'))

              if has_nss and found:
                  print(
                      f"::error::defconfig 仍启用了 NSS 冲突包:{' '.join(found)}"
                  )
                  return 2
              print('Post-defconfig NSS check: PASS (conflicts force-disabled)')
              return 0


          sys.exit(main())
          PY
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          echo "$(nproc) thread compile"
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Validate final rootfs contents
        run: |
          set -eo pipefail
          mapfile -d '' images < <(
            find openwrt/bin/targets -type f -name '*-squashfs-sysupgrade.bin' -print0
          )
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one squashfs sysupgrade image, found ${#images[@]}"
            exit 1
          fi

          mkdir -p image-verify
          tar -xf "${images[0]}" -C image-verify
          rootfs="$(find image-verify -type f -name root -print -quit)"
          [ -n "$rootfs" ] || {
            echo "::error::Sysupgrade image does not contain a root filesystem"
            exit 1
          }
          unsquashfs -ll "$rootfs" > image-verify/rootfs-files.txt

          for required in \
            'lib/modules/.*/qca-ssdk\.ko' \
            'lib/modules/.*/qca-nss-dp\.ko' \
            'lib/modules/.*/qca-nss-drv\.ko' \
            'lib/modules/.*/qca-nss-netlink\.ko' \
            'lib/modules/.*/qca-nss-qdisc\.ko' \
            'lib/modules/.*/ecm\.ko' \
            'lib/modules/.*/act_nssmirred\.ko' \
            'lib/modules/.*/zram\.ko' \
            'etc/config/ecm' \
            'etc/config/nss' \
            'etc/config/pbuf' \
            'etc/init\.d/qca-nss-ecm' \
            'etc/init\.d/qca-nss-drv' \
            'etc/init\.d/qca-nss-netlink' \
            'etc/init\.d/qca-nss-pbuf' \
            'etc/init\.d/set-irq-affinity' \
            'etc/init\.d/smp_affinity' \
            'etc/init\.d/zram' \
            'etc/openclash/core/clash_meta' \
            'etc/modprobe\.d/nss-no-flow\.conf' \
            'etc/uci-defaults/95-ax6-zram-defaults' \
            'etc/uci-defaults/98-nss-tune' \
            'etc/uci-defaults/15_smp_affinity\.sh' \
            'etc/hotplug\.d/net/99-disable_offloads' \
            'etc/hotplug\.d/net/100-disable_offloads_br_lan' \
            'lib/netifd/offload/disable_offloads\.sh' \
            'usr/lib/sqm/nss-zk\.qos' \
            'usr/bin/zerotier-fw4' \
            'sbin/nss-check' \
            'sbin/ax6-config-audit' \
            'etc/init\.d/ax6-wifi-regdom' \
            'usr/sbin/ax6-irq-affinity'; do
            grep -Eq "squashfs-root/${required}( ->|$)" image-verify/rootfs-files.txt || {
              echo "::error::Final rootfs is missing required path: $required"
              exit 1
            }
          done

          for forbidden in \
            'etc/init\.d/haproxy' \
            'etc/rc\.d/[SK][0-9]+haproxy' \
            'etc/haproxy\.cfg' \
            'usr/sbin/haproxy' \
            'usr/bin/chinadns-ng' \
            'usr/bin/dns2socks' \
            'usr/bin/dns2tcp' \
            'usr/bin/ipt2socks' \
            'etc/init\.d/microsocks' \
            'etc/rc\.d/[SK][0-9]+microsocks' \
            'etc/config/microsocks' \
            'usr/bin/microsocks' \
            'etc/modules\.d/wireguard' \
            'lib/modules/.*/wireguard\.ko' \
            'usr/bin/wg' \
            'lib/netifd/proto/wireguard\.uc' \
            'usr/bin/wireguard_watchdog'; do
            if grep -Eq "squashfs-root/${forbidden}( ->|$)" image-verify/rootfs-files.txt; then
              echo "::error::Final rootfs contains unwanted or incomplete component: $forbidden"
              exit 1
            fi
          done

          if grep -Eq \
            'squashfs-root/etc/(init\.d/ax6-irq-affinity|rc\.d/[SK][0-9]+ax6-irq-affinity)( ->|$)' \
            image-verify/rootfs-files.txt; then
            echo "::error::Final rootfs auto-enables the manual AX6 IRQ override"
            exit 1
          fi
          for enabled in \
            'etc/rc\.d/S10ax6-wifi-regdom' \
            'etc/rc\.d/S12ax6-boot-guard' \
            'etc/rc\.d/S15zram' \
            'etc/rc\.d/S26qca-nss-ecm' \
            'etc/rc\.d/S19qca-nss-pbuf' \
            'etc/rc\.d/S28qca-nss-drv' \
            'etc/rc\.d/S29qca-nss-netlink' \
            'etc/rc\.d/S93smp_affinity' \
            'etc/rc\.d/S99set-irq-affinity'; do
            grep -Eq "squashfs-root/${enabled}( ->|$)" image-verify/rootfs-files.txt || {
              echo "::error::Final rootfs is missing required startup link: $enabled"
              exit 1
            }
          done
          unsquashfs -cat "$rootfs" etc/modprobe.d/ath11k.conf \
            > image-verify/ath11k.conf
          grep -Fqx 'options ath11k frame_mode=2' image-verify/ath11k.conf
          grep -Fqx 'options ath11k nss_offload=1' image-verify/ath11k.conf
          if grep -Eq '^[[:space:]]*options[[:space:]]+ath11k[[:space:]].*rx_hash=' \
            image-verify/ath11k.conf; then
            echo "::error::Final rootfs contains unsupported ath11k rx_hash parameter"
            exit 1
          fi
          unsquashfs -cat "$rootfs" usr/lib/opkg/status \
            > image-verify/opkg-status
          target_dir=$(dirname "${images[0]}")
          mapfile -d '' device_manifests < <(
            find "$target_dir" -maxdepth 1 -type f -name '*.manifest' -print0
          )
          if [ "${#device_manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one device package manifest, found ${#device_manifests[@]}"
            exit 1
          fi
          .github/scripts/verify-device-manifest.sh \
            "${device_manifests[0]}" image-verify/opkg-status
          openclash_version=$(awk '
            BEGIN { RS=""; FS="\n" }
            {
              package=""; version=""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^Package: /) package=substr($i, 10)
                if ($i ~ /^Version: /) version=substr($i, 10)
              }
              if (package == "luci-app-openclash") print version
            }
          ' image-verify/opkg-status)
          [ "$openclash_version" = "$OPENCLASH_ACTUAL_VERSION" ] || {
            echo "::error::OpenClash package version mismatch: metadata=$OPENCLASH_ACTUAL_VERSION rootfs=${openclash_version:-missing}"
            exit 1
          }
          unsquashfs -cat "$rootfs" etc/openclash/core/clash_meta \
            > image-verify/clash_meta
          printf '%s  %s\n' "$OPENCLASH_CORE_SHA256" image-verify/clash_meta |
            sha256sum -c -
          readelf -h image-verify/clash_meta | grep -Eq '^  Machine:[[:space:]]+AArch64$' || {
            echo "::error::Final rootfs OpenClash core is not AArch64"
            exit 1
          }

          unsquashfs -cat "$rootfs" etc/init.d/qca-nss-pbuf \
            > image-verify/qca-nss-pbuf.init
          grep -Fqx 'START=19' image-verify/qca-nss-pbuf.init
          for required in \
            ath11k_sysfs_device_available \
            wait_for_ath11k_nss_offload \
            wait_for_nss_sysctls \
            'confirming dev.nss.n2hcfg.n2h_high_water_core0'; do
            grep -Fq "$required" image-verify/qca-nss-pbuf.init || {
              echo "::error::Final rootfs qca-nss-pbuf is missing source fix: $required"
              exit 1
            }
          done
          if [ "$VARIANT_TAG" = STOCK ]; then
            mapfile -d '' factory_images < <(
              find openwrt/bin/targets -type f \
                -name '*-redmi_ax6-stock-squashfs-factory.ubi' -print0
            )
            if [ "${#factory_images[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one STOCK factory UBI image, found ${#factory_images[@]}"
              exit 1
            fi
            stock_partition_size=$((0x06640000))
            stock_ubi_limit=$((0x06340000))
            factory_size=$(stat -c %s "${factory_images[0]}")
            if [ "$factory_size" -gt "$stock_ubi_limit" ]; then
              echo "::error::STOCK UBI is ${factory_size} bytes, exceeding the 0x06340000 (${stock_ubi_limit} byte) merged-layout limit with NAND bad-block reserve"
              exit 1
            fi
            echo "STOCK merged-layout UBI: ${factory_size}/${stock_ubi_limit} bytes (partition ${stock_partition_size})"
          else
            mapfile -d '' factory_images < <(
              find openwrt/bin/targets -type f \
                -name '*-redmi_ax6-squashfs-factory.ubi' -print0
            )
            if [ "${#factory_images[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one EXPAND factory UBI image, found ${#factory_images[@]}"
              exit 1
            fi
            expand_partition_size=$((0x0c000000))
            factory_size=$(stat -c %s "${factory_images[0]}")
            if [ "$factory_size" -gt "$expand_partition_size" ]; then
              echo "::error::EXPAND UBI is ${factory_size} bytes, exceeding the configured 0x0c000000 rootfs partition"
              exit 1
            fi
            echo "EXPAND UBI size: ${factory_size}/${expand_partition_size} bytes"
          fi
          echo "Final rootfs validation: PASS"

      - name: Stage release artifacts + checksums
        run: |
          set -eo pipefail
          rm -rf upload
          mkdir -p upload/upgrade upload/recovery

          mapfile -d '' upgrade_images < <(
            find openwrt/bin/targets -type f \
              -name '*-squashfs-sysupgrade.bin' -print0
          )
          if [ "${#upgrade_images[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sysupgrade image, found ${#upgrade_images[@]}"
            exit 1
          fi
          cp "${upgrade_images[@]}" upload/upgrade/

          target_dir=$(dirname "${upgrade_images[0]}")
          mapfile -d '' device_manifests < <(
            find "$target_dir" -maxdepth 1 -type f -name '*.manifest' -print0
          )
          if [ "${#device_manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one device package manifest, found ${#device_manifests[@]}"
            exit 1
          fi
          cp "${device_manifests[0]}" upload/upgrade/
          cp "${device_manifests[0]}" upload/recovery/

          find openwrt/bin/targets -type f \
            \( -name 'config.buildinfo' -o -name 'feeds.buildinfo' \
               -o -name 'version.buildinfo' \) \
            -exec cp {} upload/upgrade/ \;

          find openwrt/bin/targets -type f \
            \( -name '*-squashfs-factory.ubi' \
               -o -name '*-initramfs-uImage.itb' \) \
            -exec cp {} upload/recovery/ \;

          cd upload/upgrade
          manifest_file=$(basename "${device_manifests[0]}")
          manifest_sha256=$(sha256sum "$manifest_file")
          manifest_sha256=${manifest_sha256%% *}
          {
            echo "BUILD_REPOSITORY=$GITHUB_REPOSITORY"
            echo "BUILD_WORKFLOW_COMMIT=$GITHUB_SHA"
            echo "BUILD_RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_REPO=$SOURCE_REPO"
            echo "SOURCE_TRACKING_BRANCH=$SOURCE_TRACKING_BRANCH"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "SQM_SCRIPTS_NSS_URL=$SQM_SCRIPTS_NSS_URL"
            echo "SQM_SCRIPTS_NSS_COMMIT=$SQM_SCRIPTS_NSS_COMMIT"
            echo "LUCI_FEED_URL=$LUCI_FEED_URL"
            echo "LUCI_FEED_COMMIT=$LUCI_FEED_COMMIT"
            echo "PACKAGES_FEED_URL=$PACKAGES_FEED_URL"
            echo "PACKAGES_FEED_COMMIT=$PACKAGES_FEED_COMMIT"
            echo "ROUTING_FEED_URL=$ROUTING_FEED_URL"
            echo "ROUTING_FEED_COMMIT=$ROUTING_FEED_COMMIT"
            echo "TELEPHONY_FEED_URL=$TELEPHONY_FEED_URL"
            echo "TELEPHONY_FEED_COMMIT=$TELEPHONY_FEED_COMMIT"
            echo "VIDEO_FEED_URL=$VIDEO_FEED_URL"
            echo "VIDEO_FEED_COMMIT=$VIDEO_FEED_COMMIT"
            echo "ARGON_THEME_URL=$ARGON_THEME_URL"
            echo "ARGON_THEME_COMMIT=$ARGON_THEME_COMMIT"
            echo "ARGON_CONFIG_URL=$ARGON_CONFIG_URL"
            echo "ARGON_CONFIG_COMMIT=$ARGON_CONFIG_COMMIT"
            echo "OPENCLASH_URL=$OPENCLASH_URL"
            echo "OPENCLASH_REF=$OPENCLASH_REF"
            echo "OPENCLASH_ACTUAL_VERSION=$OPENCLASH_ACTUAL_VERSION"
            echo "OPENCLASH_ACTUAL_COMMIT=$OPENCLASH_ACTUAL_COMMIT"
            echo "OPENCLASH_CORE_URL=$OPENCLASH_CORE_URL"
            echo "OPENCLASH_CORE_SHA256=$OPENCLASH_CORE_SHA256"
            echo "DEVICE_MANIFEST_FILE=$manifest_file"
            echo "DEVICE_MANIFEST_SHA256=$manifest_sha256"
          } > BUILD-LOCK-AX6.txt
          cp ../../AX6-IPQ/files/sbin/nss-check ./nss-check.sh
          cp ../../AX6-IPQ/files/sbin/ax6-config-audit ./ax6-config-audit.sh
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-AX6.txt' \
            -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS-AX6.txt
          ls -lh

          cd ../recovery
          cp ../upgrade/BUILD-LOCK-AX6.txt ./
          mapfile -d '' recovery_images < <(
            find . -maxdepth 1 -type f \
              \( -name '*.ubi' -o -name '*.itb' \) -print0
          )
          printf '%s\n' \
            'RECOVERY IMAGES - NOT FOR LUCI OR NORMAL SYSUPGRADE' \
            'factory.ubi and initramfs ITB have different bootloader/recovery purposes.' \
            'Do not write either image to a raw NAND partition without a device-specific, verified procedure.' \
            >RECOVERY-README.txt
          if [ "${#recovery_images[@]}" -gt 0 ]; then
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-RECOVERY.txt' \
              -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS-RECOVERY.txt
          fi
          ls -lh

      - name: Package kmod for offline install
        run: |
          set -eo pipefail
          mkdir -p upload/kmod
          if [ -d openwrt/bin/targets/qualcommax/ipq807x/packages ]; then
            mkdir -p upload/kmod/packages
            find openwrt/bin/targets/qualcommax/ipq807x/packages \
              -maxdepth 1 -type f \
              \( -name 'kmod-*.ipk' -o -name 'Packages*' \) \
              -exec cp -f {} upload/kmod/packages/ \;
            if ! find upload/kmod/packages -type f -name 'kmod-*.ipk' | grep -q .; then
              echo "::warning::no kmod ipk files found"
            fi
            find upload/kmod/packages -type f -exec sha256sum {} + |
              sed 's#upload/kmod/##' >upload/kmod/KMOD-SHA256SUMS.txt
            tar -czf upload/kmod/kmod-packages.tar.gz -C upload/kmod packages KMOD-SHA256SUMS.txt
            ls -lh upload/kmod/
          else
            echo "::warning::kmod packages directory not found"
          fi

      - name: Get current date
        run: echo "CURRENT_DATE=$(date '+%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Upload kmod packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AX6_NSS_${{ env.VARIANT_TAG }}_KMOD_${{ github.sha }}
          path: upload/kmod/*
          if-no-files-found: warn
          retention-days: 90

      - name: Upload validated sysupgrade artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AX6_NSS_${{ env.VARIANT_TAG }}_SYSUPGRADE_${{ github.sha }}
          path: upload/upgrade/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload recovery images separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AX6_NSS_${{ env.VARIANT_TAG }}_RECOVERY_${{ github.sha }}
          path: upload/recovery/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload firmware to Release
        if: github.ref == 'refs/heads/main' && env.VARIANT_TAG == 'STOCK'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: AX6_NSS_${{ env.VARIANT_TAG }}_${{ env.CURRENT_DATE }}
          commit: ${{ github.sha }}
          artifacts: |
            upload/upgrade/*
            upload/kmod/*
          allowUpdates: false
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            基于 OrdinaryJoys/immortalwrt-nss(VIKINGYFY 上游 + 本仓修复)构建,带满血 NSS。

            ## 🚨 硬件变体:${{ env.VARIANT_TAG }}

            **必须确认你的硬件再刷,否则可能变砖**:

            | 变体 | 适用 | 风险 |
            |---|---|---|
            | STOCK | 1GB RAM + 128MB NAND,SMEM/custom U-Boot 合并布局 | 必须看到单 `rootfs=06640000`;不适用于原厂双槽 |
            | EXPAND | 1GB RAM + 256MB NAND(已硬件改 NAND)| 高(分区表会写死) |

            **布局不明确时不要刷写任何变体**。
            Release 仅提供正常升级使用的 `sysupgrade.bin`。`factory.ubi` 和
            initramfs ITB 只在 Actions 的独立 RECOVERY artifact 中提供,不能用于
            LuCI 正常升级,也不能当作 sysupgrade 镜像直接写入 NAND。
            刷 EXPAND 前必须确认:
            1. 已用烙铁/热风枪换过 NAND 颗粒
            2. SSH 进入设备 `cat /proc/mtd`，确认名为 `rootfs` 的分区大小 ≥ 0x0C000000

            ## 默认登录
            - 管理 IP: 192.168.5.1
            - 用户: root
            - 密码: **首次登录请用 SSH 通过 `passwd` 设置,或 LuCI Web 设置**

            ## NSS 相关
            - 默认开启 NSS,不要再去防火墙打开软件/硬件 flow offload
            - 运行 `nss-check -v` 验证 NSS 模块、参数和服务状态
            - 主动流量测试后检查 NSS accelerated count (详见 HARDWARE.md)

            ## 变砖恢复(应急)
            - 仅适用于已确认的 custom U-Boot: 物理 reset 长按进入 fastboot
            - 通过 USB-TTL 串口(115200 8N1)进 u-boot
            - 恢复操作必须使用事先备份并与当前 MIBIB/分区布局匹配的镜像
            - 不要把 `sysupgrade.bin`、`factory.ubi` 或 initramfs ITB 当作通用 raw NAND 镜像
            - 详见 AX6-IPQ/HARDWARE.md,未确认分区表前不要执行擦写

      - name: Delete old releases
        if: github.ref == 'refs/heads/main' && env.VARIANT_TAG == 'STOCK'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          gh release list --limit 100 --json tagName --jq \
            '.[] | select(.tagName | startswith("AX6_NSS_STOCK_")) | .tagName' |
          tail -n +11 |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
