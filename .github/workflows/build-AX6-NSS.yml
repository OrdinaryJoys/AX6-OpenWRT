# yamllint disable rule:line-length
name: Build OpenWRT for AX6-NSS

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Hardware variant (must match physical NAND!)'
        required: true
        type: choice
        default: 'stock'
        options:
          - stock     # 512MB/1GB RAM + SMEM layout; primary target is merged rootfs=0x06640000
          - expand    # 1GB RAM + 256MB NAND (HW-modded only) — DANGER if NAND <256MB
      ssh:
        description: 'SSH debug connection'
        required: false
        type: boolean
        default: false

env:
  BUILD_LOCK: .github/ax6-nss-lock.env
  EXTRA_CONFIG: AX6-IPQ/nss-extra.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai
  # NSS 互斥包黑名单 — 三处 (pre-flight Python / sed / post-defconfig Python) 共用
  # 必须空格分隔以便 shell for-loop 与 Python split() 同时可用
  NSS_BLACKLIST: >-
    kmod-nf-flow
    kmod-ipt-offload
    kmod-nft-offload
    kmod-fast-classifier
    kmod-shortcut-fe
    kmod-shortcut-fe-cm

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # Keep preinstalled Clang/LLVM: they are explicit OpenWrt dependencies.
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set variant config + brick-safety pre-flight
        id: variant
        env:
          VARIANT_INPUT: ${{ github.event.inputs.variant }}
        run: |
          set -eo pipefail
          case "$VARIANT_INPUT" in
            stock)
              CFG="AX6-IPQ/.config-stock"; TAG="STOCK"
              echo "::notice::Building STOCK profile (512MB/1GB RAM; validated target: 0x06640000 SMEM/custom U-Boot merged layout; dual-slot devices retain runtime size rejection)"
              ;;
            expand)
              CFG="AX6-IPQ/.config-expand"; TAG="EXPAND"
              echo "::warning::Building EXPAND variant — requires HW-modded NAND ≥256MB. DO NOT FLASH if NAND is 128MB!"
              ;;
            *)
              echo "::error::Unknown variant: $VARIANT_INPUT"; exit 1
              ;;
          esac
          # Export to subsequent steps via $GITHUB_ENV
          {
            echo "CONFIG_FILE=$CFG"
            echo "VARIANT_TAG=$TAG"
          } >> "$GITHUB_ENV"
          # Pre-flight check in this step: pass CFG via local env var (NOT $GITHUB_ENV
          # which only applies to subsequent steps)
          export _PREFLIGHT_CFG="$CFG"
          python3 - <<'PY'
          """Pre-flight 校验:在 feeds 拉取前检查 .config 与 NSS 冲突。"""
          import os
          import re
          import sys

          PAT_Y = re.compile(r'^CONFIG_(PACKAGE_[\w-]+)=([ymn])$')
          PAT_N = re.compile(r'^# CONFIG_(PACKAGE_[\w-]+) is not set$')

          def parse_config(path):
              """读取 OpenWrt .config,返回 {symbol: 'y'|'n'} 字典。"""
              result = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      m = PAT_Y.match(line)
                      if m:
                          result[m.group(1)] = m.group(2)
                          continue
                      m = PAT_N.match(line)
                      if m:
                          result[m.group(1)] = 'n'
              return result


          def main():
              cfg_path = os.environ['_PREFLIGHT_CFG']
              extra_path = 'AX6-IPQ/nss-extra.config'
              # 与 env.NSS_BLACKLIST 共用同一份真正互斥的 flow-offload 黑名单。
              blacklist = os.environ['NSS_BLACKLIST'].split()

              merged = parse_config(cfg_path)
              merged.update(parse_config(extra_path))

              if merged.get('PACKAGE_kmod-qca-nss-drv') != 'y':
                  print(f'Pre-flight skip (no NSS) for {cfg_path}')
                  return 0

              for pkg in blacklist:
                  if merged.get(f'PACKAGE_{pkg}') == 'y':
                      print(
                          f'::error::NSS conflict: PACKAGE_{pkg}=y '
                          f'collides with kmod-qca-nss-drv'
                      )
                      return 2

              print(f'Pre-flight PASS for {cfg_path}')
              return 0


          sys.exit(main())
          PY

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eo pipefail
          # 改用仓内固化的依赖清单(去除远程 curl|apt 注入风险)
          mapfile -t PKGS < <(grep -v '^\s*#' .github/depends-ubuntu-2204.txt | grep -v '^\s*$')
          sudo -E apt-get -qq -o Acquire::Retries=3 update
          sudo -E apt-get -qq -o Acquire::Retries=3 install -y --no-install-recommends "${PKGS[@]}"
          sudo -E apt-get -qq clean
          sudo chown -R "$USER":"$(id -gn)" "$GITHUB_WORKSPACE"

      - name: Load and verify build lock
        run: |
          set -eo pipefail
          set -a
          # shellcheck source=.github/ax6-nss-lock.env
          . "$BUILD_LOCK"
          set +a
          for name in \
            SOURCE_REPO SOURCE_TRACKING_BRANCH SOURCE_BASE_COMMIT SOURCE_COMMIT \
            SOURCE_PATCHSET_MANIFEST_SHA256 \
            SQM_SCRIPTS_NSS_URL SQM_SCRIPTS_NSS_COMMIT \
            LUCI_FEED_URL LUCI_FEED_TRACKING_BRANCH LUCI_FEED_COMMIT \
            PACKAGES_FEED_URL PACKAGES_FEED_COMMIT PACKAGES_FEED_POLICY \
            CGI_IO_SECURITY_BACKPORT_COMMIT \
            ROUTING_FEED_URL ROUTING_FEED_COMMIT \
            TELEPHONY_FEED_URL TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_URL VIDEO_FEED_COMMIT \
            ARGON_THEME_URL ARGON_THEME_COMMIT \
            ARGON_CONFIG_URL ARGON_CONFIG_COMMIT \
            OPENCLASH_URL OPENCLASH_REF \
            SOURCE_HOSTAPD_PKG_RELEASE SOURCE_QCA_NSS_DRV_PKG_RELEASE \
            SOURCE_QCA_NSS_ECM_PKG_RELEASE SOURCE_QCA_NSS_CLIENTS_PKG_RELEASE \
            SOURCE_QCA_MCS_PKG_RELEASE; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is missing from $BUILD_LOCK"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          for name in \
            SOURCE_BASE_COMMIT SOURCE_COMMIT SQM_SCRIPTS_NSS_COMMIT LUCI_FEED_COMMIT \
            PACKAGES_FEED_COMMIT CGI_IO_SECURITY_BACKPORT_COMMIT \
            ROUTING_FEED_COMMIT TELEPHONY_FEED_COMMIT \
            VIDEO_FEED_COMMIT ARGON_THEME_COMMIT ARGON_CONFIG_COMMIT; do
            value="${!name}"
            if ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$name must be a full 40-character lowercase commit SHA"
              exit 1
            fi
          done
          if ! [[ "$SOURCE_PATCHSET_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SOURCE_PATCHSET_MANIFEST_SHA256 must be a 64-character lowercase SHA256"
            exit 1
          fi

      - name: Clone locked source code
        run: |
          set -eo pipefail
          git init openwrt
          git -C openwrt remote add origin "$SOURCE_REPO"
          git -C openwrt fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          git -C openwrt fetch --depth 1 origin "$SOURCE_BASE_COMMIT"
          actual=$(git -C openwrt rev-parse HEAD)
          [ "$actual" = "$SOURCE_COMMIT" ] || {
            echo "::error::Source lock mismatch: expected $SOURCE_COMMIT, got $actual"
            exit 1
          }
          .github/scripts/verify-ax6-source-patchset.sh \
            openwrt \
            "$GITHUB_WORKSPACE/.github/ax6-source-patchset.sha256" \
            "$GITHUB_WORKSPACE/.github/ax6-source-patchset.absent" \
            "$SOURCE_PATCHSET_MANIFEST_SHA256" \
            "$SOURCE_BASE_COMMIT"
          .github/scripts/verify-ax6-source-semantics.sh \
            openwrt "$GITHUB_WORKSPACE/$BUILD_LOCK"
          kernel_mk="openwrt/target/linux/generic/kernel-6.18"
          grep -Fxq 'LINUX_VERSION-6.18 = .38' "$kernel_mk" || {
            echo "::error file=$kernel_mk::AX6 source must use Linux 6.18.38"
            exit 1
          }
          grep -Fxq 'LINUX_KERNEL_HASH-6.18.38 = ac26e508abd56e9f8b89872b6e10c49fc823bcc70d8068a5d8504c1a7c4ff045' "$kernel_mk" || {
            echo "::error file=$kernel_mk::Linux 6.18.38 archive hash is missing or incorrect"
            exit 1
          }
          ax6_image_mk="openwrt/target/linux/qualcommax/image/ipq807x.mk"
          grep -Fqx $'\tDEVICE_PACKAGES := ipq-wifi-redmi_ax6 -kmod-usb3 -kmod-usb-dwc3 -kmod-usb-dwc3-qcom -automount' "$ax6_image_mk" || {
            echo "::error file=$ax6_image_mk::AX6 must retain the official USB and automount package exclusions"
            exit 1
          }
          hostapd_dir="openwrt/package/network/services/hostapd"
          for security_patch in \
            001-AP-MLD-Fix-link-ID-validation-in-Basic-MLE-parsing.patch \
            002-BSS-Add-bounds-check-for-link_id-in-Basic-MLE-parsin.patch \
            003-MLD-Validate-MLE-Link-ID-fields-in-association-rejec.patch \
            004-Verify-MLD-link-ID-validity-in-get_basic_mle_link_id.patch \
            005-MLD-Verify-link-ID-validity-in-MLE-in-reconfiguratio.patch \
            006-AP-MLD-Verify-AP-MLD-link-ID-validity-before-updatin.patch \
            007-MLD-Fix-length-check-in-common-info-for-association-.patch \
            008-BSS-Fix-validation-of-ML-common-info-length-during-s.patch; do
            [ -s "$hostapd_dir/patches/$security_patch" ] || {
              echo "::error file=$hostapd_dir/patches/$security_patch::missing hostapd 2026-1 security fix"
              exit 1
            }
          done
          ecm_vlan_patch="openwrt/package/qca-nss/qca-nss-ecm/patches/026-frontends-nss-respect-bridge-port-vlan-tagging-for-vlan-over-bridge.patch"
          grep -Fq 'ecm_interface_bridge_vlan_wire_tagged' "$ecm_vlan_patch" || {
            echo "::error file=$ecm_vlan_patch::missing bridge-port on-wire VLAN decision"
            exit 1
          }
          ssdk_patch="openwrt/package/qca-nss/qca-ssdk/patches/009-feature-nss-dp-netdev-mac-sync.patch"
          grep -Fq 'ssdk_netdev_refresh_mac_sw_sync' "$ssdk_patch" || {
            echo "::error file=$ssdk_patch::missing NSS-DP MAC synchronization fix"
            exit 1
          }
          wifi_supplicant="openwrt/package/network/config/wifi-scripts/files-ucode/usr/share/ucode/wifi/supplicant.uc"
          grep -Fq "const eap_method_map = { fast: 'FAST', peap: 'PEAP', ttls: 'TTLS', tls: 'TLS' };" "$wifi_supplicant" || {
            echo "::error file=$wifi_supplicant::missing outer EAP method mapping"
            exit 1
          }
          [ -x "$wifi_supplicant" ] || {
            echo "::error file=$wifi_supplicant::wifi ucode helper lost its executable mode"
            exit 1
          }
          ath11k_recovery_dir="openwrt/package/kernel/mac80211/patches/nss/ath11k"
          for recovery_patch in \
            911-wifi-ath11k-complete-pending-tx-frames-on-mac-stop.patch \
            912-wifi-ath11k-do-not-warn-about-htt-event-48.patch \
            999-926-ath11k-skip-mon-status-reap-until-ring-initialized.patch \
            999-929-ath11k-ce-send-srng-guard.patch \
            999-930-ath11k-drop-data-tx-during-crash-recovery.patch \
            999-931-ath11k-guard-ce-send-reap-against-cleared-srng.patch \
            999-932-ath11k-quiesce-irqs-before-recovery-ring-reset.patch; do
            [ -s "$ath11k_recovery_dir/$recovery_patch" ] || {
              echo "::error file=$ath11k_recovery_dir/$recovery_patch::missing ath11k recovery guard"
              exit 1
            }
          done
          ath_mk="openwrt/package/kernel/mac80211/ath.mk"
          for dependency in \
            '+ATH11K_NSS_SUPPORT:kmod-qca-nss-drv' \
            '+ATH11K_NSS_MESH_SUPPORT:kmod-qca-nss-drv-wifi-meshmgr' \
            '+@(ATH11K_NSS_SUPPORT):NSS_DRV_WIFIOFFLOAD_ENABLE' \
            '+@(ATH11K_NSS_SUPPORT):NSS_DRV_WIFI_EXT_VDEV_ENABLE'; do
            grep -Fq "$dependency" "$ath_mk" || {
              echo "::error file=$ath_mk::missing ATH11K NSS dependency: $dependency"
              exit 1
            }
          done
          # shellcheck disable=SC2016 # Match literal Makefile config expression.
          grep -Fq 'config-$(CONFIG_ATH11K_NSS_MESH_SUPPORT) += ATH11K_NSS_MESH_SUPPORT' "$ath_mk" || {
            echo "::error file=$ath_mk::ATH11K_NSS_MESH_SUPPORT must be controlled by CONFIG_ATH11K_NSS_MESH_SUPPORT"
            exit 1
          }
          # shellcheck disable=SC2016 # Match literal Makefile config expression.
          grep -Fq 'config-$(CONFIG_ATH11K_NSS_SUPPORT) += ATH11K_NSS_SUPPORT' "$ath_mk" || {
            echo "::error file=$ath_mk::ATH11K_NSS_SUPPORT must not also enable mesh support"
            exit 1
          }
          # shellcheck disable=SC2016 # Match literal Makefile config expression.
          if grep -Eq 'config-\$\(CONFIG_ATH11K_NSS_SUPPORT\).*ATH11K_NSS_MESH_SUPPORT' "$ath_mk"; then
            echo "::error file=$ath_mk::ATH11K_NSS_SUPPORT must not force ATH11K_NSS_MESH_SUPPORT"
            exit 1
          fi
          AX6-IPQ/scripts/check-ath11k-nss-peer-stats.sh \
            openwrt/package/kernel/mac80211/patches/nss/ath11k/199-002-ath11k_nss-add-nss-driver-interface.patch
          AX6-IPQ/scripts/check-ax6-stock-smem-nvmem.sh openwrt
          platform_sh="openwrt/target/linux/qualcommax/ipq807x/base-files/lib/upgrade/platform.sh"
          grep -Fq 'xiaomi_stock_check_image_size' "$platform_sh" || {
            echo "::error file=$platform_sh::missing runtime MTD/image capacity preflight"
            exit 1
          }
          grep -Fq 'xiaomi_stock_get_upgrade_part' "$platform_sh" || {
            echo "::error file=$platform_sh::missing dynamic rootfs/rootfs_1 selection"
            exit 1
          }
          upgrade_test="openwrt/tests/qualcommax-xiaomi-stock-upgrade.sh"
          [ -x "$upgrade_test" ] || {
            echo "::error file=$upgrade_test::missing executable Xiaomi stock upgrade regression test"
            exit 1
          }
          "$upgrade_test"
          offload_helper="openwrt/package/qca-nss/qca-nss-ecm/files/disable_offloads.sh"
          offload_test="openwrt/package/qca-nss/qca-nss-ecm/tests/test-disable-offloads.sh"
          [ -x "$offload_helper" ] || {
            echo "::error file=$offload_helper::locked ECM offload helper is missing or not executable"
            exit 1
          }
          [ -x "$offload_test" ] || {
            echo "::error file=$offload_test::locked ECM offload policy fixture is missing or not executable"
            exit 1
          }
          sh -n "$offload_helper" "$offload_test"
          sh "$offload_test" "$offload_helper"
          pbuf_classifier="AX6-IPQ/files/usr/libexec/ax6-nss-pbuf-classify"
          test -x "$pbuf_classifier"
          sh -n "$pbuf_classifier" AX6-IPQ/files/sbin/nss-check tests/test-pbuf-fixture.sh
          NSS_PBUF_CLASSIFIER="$pbuf_classifier" sh tests/test-pbuf-fixture.sh

      - name: Add NSS feed and prepare feeds
        run: |
          set -eo pipefail
          cd openwrt
          # Replace every moving feed with the commits in the build lock.
          cat > feeds.conf.default <<EOF
          src-git sqm_scripts_nss ${SQM_SCRIPTS_NSS_URL}^${SQM_SCRIPTS_NSS_COMMIT}
          src-git packages ${PACKAGES_FEED_URL}^${PACKAGES_FEED_COMMIT}
          src-git luci ${LUCI_FEED_URL}^${LUCI_FEED_COMMIT}
          src-git routing ${ROUTING_FEED_URL}^${ROUTING_FEED_COMMIT}
          src-git telephony ${TELEPHONY_FEED_URL}^${TELEPHONY_FEED_COMMIT}
          src-git video ${VIDEO_FEED_URL}^${VIDEO_FEED_COMMIT}
          EOF
          # 全量刷新
          ./scripts/feeds clean
          rm -rf tmp/
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # nss_ipv4_reasm 前置声明已由锁定 NSS feed 的
          # 0035-nss-drv-add-ipv4-reasm-prototypes.patch 提供,不再需要补丁 0040.
          # qca-mcs kernel 6.18 兼容补丁也已在 feed 0005-kernel-6.18.patch 中.

      - name: Load custom config and apply DIY
        run: |
          set -eo pipefail
          # 用 cp 而非 mv,本地反复跑也不破仓
          # 先删除目标避免 cp -r 嵌套:若 openwrt/files 已存在,
          # cp -r AX6-IPQ/files openwrt/files 会变成 openwrt/files/files/
          rm -rf openwrt/files
          [ -e "$FILES" ] && cp -r "$FILES" openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          # 关键修复:把 NSS 互斥/必需配置追加到 .config
          if [ -e "$EXTRA_CONFIG" ]; then
            cat "$EXTRA_CONFIG" >> openwrt/.config
          fi
          chmod +x "$DIY_SH"
          ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_SH" )

      - name: Verify compatible package security backport
        run: |
          set -eo pipefail
          cgi_makefile=openwrt/feeds/packages/net/cgi-io/Makefile
          grep -Fqx 'PKG_SOURCE_DATE:=2026-07-21' "$cgi_makefile"
          grep -Fqx 'PKG_SOURCE_VERSION:=31cb3c89f02d918d7f17bf62a80c852fc38a1ca1' "$cgi_makefile"
          grep -Fqx 'PKG_MIRROR_HASH:=ecb2ce93b5f62d9fa35ca2b514faa5ef14e462d782bc1dd0de0e4b2ecabcec71' "$cgi_makefile"
          if grep -Fq '7314451cb99692c0862a70c3307ee08bd2fbd9c0' "$cgi_makefile"; then
            echo "::error file=$cgi_makefile::obsolete cgi-io source remains after security backport"
            exit 1
          fi

      - name: Verify tracked OpenClash inputs
        run: |
          set -eo pipefail
          metadata=openwrt/.openclash-build.env
          [ -s "$metadata" ] || {
            echo "::error file=$metadata::OpenClash build metadata is missing"
            exit 1
          }
          set -a
          # shellcheck source=/dev/null
          . "$metadata"
          set +a
          printf '%s\n' "$OPENCLASH_ACTUAL_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          for name in \
            OPENCLASH_RESOLVED_COMMIT OPENCLASH_ACTUAL_COMMIT \
            OPENCLASH_CORE_COMMIT \
            METACUBEXD_COMMIT ZASHBOARD_COMMIT; do
            printf '%s\n' "${!name}" | grep -Eq '^[0-9a-f]{40}$' || {
              echo "::error::$name is not a full commit SHA"
              exit 1
            }
          done
          [ "$OPENCLASH_ACTUAL_COMMIT" = "$OPENCLASH_RESOLVED_COMMIT" ] || {
            echo "::error::OpenClash checked-out commit differs from the build-time resolved ref"
            exit 1
          }
          for name in \
            OPENCLASH_CORE_SHA256 METACUBEXD_ARCHIVE_SHA256 \
            ZASHBOARD_ARCHIVE_SHA256; do
            printf '%s\n' "${!name}" | grep -Eq '^[0-9a-f]{64}$' || {
              echo "::error::$name is not a SHA256"
              exit 1
            }
          done
          for name in \
            OPENCLASH_ACTUAL_VERSION OPENCLASH_RESOLVED_COMMIT \
            OPENCLASH_ACTUAL_COMMIT \
            OPENCLASH_CORE_COMMIT OPENCLASH_CORE_URL OPENCLASH_CORE_SHA256 \
            METACUBEXD_REPO METACUBEXD_REF METACUBEXD_COMMIT \
            METACUBEXD_ARCHIVE_SHA256 ZASHBOARD_REPO ZASHBOARD_REF \
            ZASHBOARD_COMMIT ZASHBOARD_ARCHIVE_SHA256; do
            [ -n "${!name}" ] || {
              echo "::error::$name is missing from OpenClash build metadata"
              exit 1
            }
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - name: SSH debug (manual trigger)
        if: ${{ github.event.inputs.ssh == 'true' || github.event.inputs.ssh == true }}
        uses: P3TERX/ssh2actions@71006b93bff498b020448ac10964f8a5d0f9f32c  # v1.0.0
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download package
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          make defconfig 2>&1 | tee defconfig.log
          if grep -q 'recursive dependency detected' defconfig.log; then
            echo "::error::Kconfig recursive dependency detected"
            exit 1
          fi
          # defconfig 会重新启用 CONFIG_KERNEL_WERROR,导致 -Wmissing-prototypes 变成硬错误,
          # 进而导致 NSS 外部内核模块(qca-nss-drv/qca-mcs 等)编译失败。
          # 此处强制禁用以避免连锁问题。
          sed -i 's/^CONFIG_KERNEL_WERROR=y$/# CONFIG_KERNEL_WERROR is not set/' .config
          # 防御:确保 ip_tables.ko / ip6_tables.ko 内核选项启用
          # nss-fork b0c5bf38 已删除 kmod-nf-ipt 错误的 +!LINUX_6_12:kmod-iptables 依赖,
          # 这两行变成幂等防御(make defconfig 会通过 kmod-nf-ipt KCONFIG 自动处理),
          # 但保留以防止未来上游回归。
          grep -q 'CONFIG_IP_NF_IPTABLES=m' .config || echo 'CONFIG_IP_NF_IPTABLES=m' >> .config
          grep -q 'CONFIG_IP6_NF_IPTABLES=m' .config || echo 'CONFIG_IP6_NF_IPTABLES=m' >> .config
          grep -q 'CONFIG_NETFILTER_XTABLES=m' .config || echo 'CONFIG_NETFILTER_XTABLES=m' >> .config
          # defconfig 通过 firewall4→kmod-nft-offload→kmod-nf-flow 依赖链
          # 强制拉回 NSS 冲突包,此处 sed 强制覆盖为 =n
          # 黑名单来自 env.NSS_BLACKLIST(单一来源,与 pre-flight Python 共用)
          for pkg in $NSS_BLACKLIST; do
            sed -i "s|^CONFIG_PACKAGE_${pkg}=y$|# CONFIG_PACKAGE_${pkg} is not set|" .config
          done
          # 当前源树仍定义的 WIFI_MESH 需要 FW 11.4；本构建使用 FW 12.5。
          #   https://github.com/qosmio/openwrt-ipq#nss-support-matrix
          sed -i \
            's|^CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y$|# CONFIG_NSS_DRV_WIFI_MESH_ENABLE is not set|' \
            .config
          # 验证 NSS_DRV 不支持项已清除 (不包括 RMNET:🟨 qca-nss-netlink 依赖)
          if grep -q '^CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y$' .config; then
            echo "::error::NSS FW 12.5 unsupported: CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y still enabled after sed"
            exit 2
          fi
          # 验证:确保 NSS 冲突包不再出现
          python3 - <<'PY'
          """Post-defconfig 校验:sed 拉黑后再扫一遍 .config,确保没漏。"""
          import os
          import sys


          def main():
              blacklist = os.environ['NSS_BLACKLIST'].split()
              expected_off = {f'CONFIG_PACKAGE_{pkg}=y' for pkg in blacklist}
              has_nss = False
              found = []

              with open('.config') as fh:
                  for line in fh:
                      line = line.strip()
                      if line == 'CONFIG_PACKAGE_kmod-qca-nss-drv=y':
                          has_nss = True
                      if line in expected_off:
                          # 形如 CONFIG_PACKAGE_kmod-nf-flow=y → 报告 kmod-nf-flow
                          found.append(line.split('=', 1)[0].removeprefix('CONFIG_PACKAGE_'))

              if has_nss and found:
                  print(
                      f"::error::defconfig 仍启用了 NSS 冲突包:{' '.join(found)}"
                  )
                  return 2
              print('Post-defconfig NSS check: PASS (conflicts force-disabled)')
              return 0


          sys.exit(main())
          PY
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Fast gate — NSS patch prepare (P0-D.6)
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          sh tests/test-edma-correctness-prerequisites.sh
          sh tests/test-apcs-regmap-boundary.sh
          sh tests/test-qcom-hwspinlock-regmap-boundary.sh
          sh tests/test-qca-nss-pbuf-readback.sh
          sh tests/test-qca-mcs-log-level.sh
          sh tests/test-nss-targeted-backports.sh
          sh tests/test-set-irq-affinity-device-discovery.sh
          sh tests/test-nss-drv-sysctl-log-level.sh
          echo "=== qca-nss-dp prepare (patch apply check) ==="
          make package/qca-nss/qca-nss-dp/prepare V=s
          echo "=== qca-nss-drv prepare (patch apply check) ==="
          make package/qca-nss/qca-nss-drv/prepare V=s
          echo "=== qca-nss-ecm prepare (patch apply check) ==="
          make package/qca-nss/qca-nss-ecm/prepare V=s
          echo "=== ZeroTier prepare (AX6 UDP buffer patch apply check) ==="
          make package/feeds/packages/zerotier/prepare V=s
          mapfile -d '' zerotier_dirs < <(
            find build_dir -type d -name 'ZeroTierOne-*' -print0
          )
          if [ "${#zerotier_dirs[@]}" -ne 1 ]; then
            echo "::error::Expected one prepared ZeroTier source directory; found ${#zerotier_dirs[@]}"
            exit 1
          fi
          grep -Fqx '#define ZT_UDP_DESIRED_BUF_SIZE 4194304' \
            "${zerotier_dirs[0]}/node/Constants.hpp" || {
            echo "::error::Prepared ZeroTier source is missing the AX6 4 MiB UDP socket-buffer fix"
            exit 1
          }
          if grep -Fqx '#define ZT_UDP_DESIRED_BUF_SIZE 1048576' \
              "${zerotier_dirs[0]}/node/Constants.hpp"; then
            echo "::error::Prepared ZeroTier source still uses the overflow-prone 1 MiB UDP buffer"
            exit 1
          fi
          echo "All NSS patches applied successfully."
          echo "(Module compile requires full toolchain — done in Compile firmware step.)"

      - name: Regression assertions — 007/008, 012, 018/019 (P0-D.3-5)
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          mapfile -d '' dp_dirs < <(
            find build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq807x \
              -maxdepth 1 -type d -name 'qca-nss-dp-*' -print0
          )
          mapfile -d '' drv_dirs < <(
            find build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq807x \
              -maxdepth 1 -type d -name 'qca-nss-drv-*' -print0
          )
          if [ "${#dp_dirs[@]}" -ne 1 ] || [ "${#drv_dirs[@]}" -ne 1 ]; then
            echo "::error::Expected one prepared qca-nss-dp and qca-nss-drv directory; found dp=${#dp_dirs[@]} drv=${#drv_dirs[@]}"
            exit 1
          fi
          dp_src=${dp_dirs[0]}
          drv_src=${drv_dirs[0]}
          edma_v1_src="$dp_src/hal/dp_ops/edma_dp/edma_v1"
          [ -d "$edma_v1_src" ] || {
            echo "::error::Prepared qca-nss-dp source has no EDMA v1 implementation"
            exit 1
          }

          echo "=== P0-D.3: 007 TXmod — correct expression in prepared source ==="
          grep -rq 'skbq % edma_hw\.txdesc_rings' "$dp_src" || {
            echo "::error::007 TXmod: corrected modulo expression not found in prepared qca-nss-dp source"
            exit 1
          }
          grep -r 'edma_hw\.txdesc_rings % skbq' "$dp_src" && {
            echo "::error::007 TXmod: OLD (reversed) modulo expression still present in prepared source"
            exit 1
          }
          echo "OK: 007 TXmod expression verified"

          echo "=== Candidate 008: EDMA v1 correctness prerequisites only ==="
          for required in \
            'dma_mapping_error' \
            'tx_dma_store' \
            'Invalid Rx skb index' \
            'tx_irqs = 0, rxfill_irqs = 0, rxdesc_irqs = 0'; do
            grep -rq "$required" "$edma_v1_src" || {
              echo "::error::008: missing EDMA correctness invariant: $required"
              exit 1
            }
          done
          grep -rq 'netif_napi_add(netdev, &edma_hw\.napi, edma_napi)' "$edma_v1_src" || {
            echo "::error::008: D1 must preserve the original single-NAPI registration"
            exit 1
          }
          if grep -rq 'edma_handle_rx_irq\|edma_handle_tx_irq\|napi_gro_receive\|NETIF_F_GRO' "$edma_v1_src"; then
            echo "::error::008: D1 must not include split-NAPI or GRO variables"
            exit 1
          fi
          echo "OK: 008 EDMA correctness-only invariants verified"

          echo "=== P0-D.4: 012 fused — stats_enable=1 + read-path preserved ==="
          grep -rq 'stats_enable = 1' "$drv_src" || {
            echo "::error::012 fused: stats_enable=1 not found in prepared qca-nss-drv source"
            exit 1
          }
          echo "OK: 012 fused stats_enable=1 verified"

          echo "=== P0-D.5: 018 NAPI unwind ==="
          grep -rq 'netif_napi_del' "$drv_src" || {
            echo "::error::018: netif_napi_del not found in prepared qca-nss-drv source"
            exit 1
          }
          echo "OK: 018 NAPI unwind verified"

          echo "=== P0-D.5: 019 DMA mapping_error ==="
          grep -rq 'dma_mapping_error' "$drv_src" || {
            echo "::error::019: dma_mapping_error not found in prepared qca-nss-drv source"
            exit 1
          }
          echo "OK: 019 DMA mapping_error verified"

          echo "All regression assertions passed."

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          echo "$(nproc) thread compile"
          make -j"$(nproc)" V=s || make -j1 V=s

