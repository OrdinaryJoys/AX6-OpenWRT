# yamllint disable rule:line-length
name: Build OpenWRT-IMM for AX6

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: AX6-IMM/.config
  DIY_SH: AX6-IMM/diy.sh
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Free disk space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c  # v10
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eo pipefail
          mapfile -t PKGS < <(grep -v '^\s*#' .github/depends-ubuntu-2204.txt | grep -v '^\s*$')
          sudo -E apt-get -qq -o Acquire::Retries=3 update
          sudo -E apt-get -qq -o Acquire::Retries=3 install -y --no-install-recommends "${PKGS[@]}"
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo chown -R "$USER":"$(id -gn)" "$GITHUB_WORKSPACE"

      - name: Clone source code
        run: git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Update & install feeds
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config and apply DIY
        run: |
          set -eo pipefail
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_SH"
          ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_SH" )

      - name: Download package
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          make defconfig
          sed -i 's/^CONFIG_KERNEL_WERROR=y$/# CONFIG_KERNEL_WERROR is not set/' .config
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          set -eo pipefail
          echo "$(nproc) thread compile"
          make -j"$(nproc)" V=s

      - name: Stage release artifacts
        run: |
          set -eo pipefail
          mkdir -p upload
          find openwrt/bin/targets -type f \( -name '*.ubi' -o -name '*.bin' \) -exec cp {} upload/ \;
          ls -lh upload/

      - name: Upload unvalidated backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AX6_IMM_UNVALIDATED_${{ github.sha }}
          path: upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
